<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频监控 - 智慧农业平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="camera">

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content camera-page">
        <div class="camera-head">
          <div>
            <div class="section-title">视频监控</div>
            <div class="camera-sub">六路监控大屏 · 摄像头实时画面 · 人体识别告警同步</div>
          </div>
          <div class="camera-actions">
            <select class="form-control" id="cameraControlSelect"></select>
            <button class="btn btn-primary btn-sm" id="powerOnCamera" type="button">开启</button>
            <button class="btn btn-outline btn-sm" id="powerOffCamera" type="button">关闭</button>
            <button class="btn btn-outline btn-sm" id="reloadCamera" type="button">刷新画面</button>
            <button class="btn btn-outline btn-sm" id="reloadDetection" type="button">刷新告警</button>
            <button class="btn btn-outline btn-sm" id="startDetectionWorker" type="button">启动 worker</button>
          </div>
        </div>

        <section class="monitor-wall" id="monitorWall"></section>

        <section class="camera-records">
          <div class="card-header">
            <div>
              <div class="card-title">人体识别记录</div>
              <div class="card-sub">YOLO 检测到人体时自动保存事件片段，并同步到告警管理</div>
            </div>
            <div class="flex gap-8">
              <input class="form-control" id="recordDate" type="date">
              <button class="btn btn-outline btn-sm" id="clearRecordDate" type="button">全部日期</button>
            </div>
          </div>
          <div class="detection-record-list" id="detectionRecordList">
            <div class="empty-state">正在加载识别记录</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal-mask" id="cameraAddModal">
    <div class="modal camera-add-modal">
      <div class="modal-title" id="cameraAddTitle">添加摄像头</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">摄像头名称</label>
          <input class="form-control" id="cameraNameInput" type="text" placeholder="如：一号大棚摄像头">
        </div>
        <div class="form-group">
          <label class="form-label">绑定地块</label>
          <select class="form-control" id="cameraPlotSelect"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">协议</label>
          <select class="form-control" id="cameraProtocolInput">
            <option value="mjpeg">MJPEG / HTTP</option>
            <option value="http">HTTP</option>
            <option value="rtsp">RTSP</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">IP</label>
          <input class="form-control" id="cameraIpInput" type="text" placeholder="如 192.168.43.121">
        </div>
        <div class="form-group">
          <label class="form-label">端口</label>
          <input class="form-control" id="cameraPortInput" type="number" min="1" max="65535" placeholder="如 8080">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group mb-0">
          <label class="form-label">用户名</label>
          <input class="form-control" id="cameraUsernameInput" type="text" placeholder="无则留空">
        </div>
        <div class="form-group mb-0">
          <label class="form-label">密码</label>
          <input class="form-control" id="cameraPasswordInput" type="password" placeholder="无则留空">
        </div>
      </div>
      <div class="form-hint mt-12" id="cameraAddHint">添加后会立即重新检索连接状态，成功后自动显示画面。</div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelCameraAdd" type="button">取消</button>
        <button class="btn btn-primary" id="confirmCameraAdd" type="button">添加并连接</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="cameraZoomModal">
    <div class="modal camera-zoom-modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="cameraZoomTitle">监控画面</div>
          <div class="modal-sub" id="cameraZoomSub">--</div>
        </div>
        <button class="modal-close" id="closeCameraZoom" type="button">×</button>
      </div>
      <div class="zoom-camera-frame">
        <img id="cameraZoomImg" alt="放大监控画面">
        <div class="camera-placeholder" id="cameraZoomPlaceholder">
          <div class="placeholder-title">正在连接摄像头</div>
          <div class="placeholder-sub">请稍候</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="detectionModal" style="display:none;">
    <div class="modal detection-modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="detectionModalTitle">识别回放</div>
          <div class="modal-sub" id="detectionModalSub">--</div>
        </div>
        <button class="modal-close" id="closeDetectionModal" type="button">×</button>
      </div>
      <video id="detectionVideo" controls playsinline></video>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    Layout.init();

    var SCREEN_COUNT = 6;
    var BINDING_KEY = 'agri_camera_screen_bindings_v2';
    var POWER_KEY = 'agri_camera_screen_power_v2';
    var cameras = [];
    var plots = [];
    var alarms = [];
    var detectionRecords = [];
    var screens = [];
    var bindings = loadJson(BINDING_KEY, {});
    var power = loadJson(POWER_KEY, {});
    var pendingSlot = 0;
    var zoomStream = { seq: 0, useProxy: false, timer: null, screen: null, movedImg: null, originalParent: null, fallbackImg: null };
    var initialRecordId = new URLSearchParams(location.search).get('recordId');

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function loadJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
    }

    function saveJson(key, data) {
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }

    function cameraAuth(cam) {
      var username = cam && cam.username && cam.username !== 'null' ? cam.username : '';
      var password = cam && cam.password && cam.password !== 'null' ? cam.password : '';
      return username ? encodeURIComponent(username) + ':' + encodeURIComponent(password) + '@' : '';
    }

    function directCameraUrl(cam) {
      return 'http://' + cameraAuth(cam) + cam.ip + ':' + cam.port + '/video?_=' + Date.now();
    }

    function proxyCameraUrl(cam) {
      return 'api/camera/mjpeg?deviceId=' + encodeURIComponent(cam.id) + '&_=' + Date.now();
    }

    function cameraUrl(cam, useProxy) {
      if (API.isSimulatorMode && API.isSimulatorMode()) return API.getSimulatorCameraSource();
      return useProxy ? proxyCameraUrl(cam) : directCameraUrl(cam);
    }

    function useCameraPlayer(cam) {
      return String((cam && cam.protocol) || '').toLowerCase() === 'http';
    }

    function cameraPlayerUrl(cam) {
      return 'api/camera/player?deviceId=' + encodeURIComponent(cam.id) + '&_=' + Date.now();
    }

    function cameraById(id) {
      return cameras.filter(function (cam) { return cam.id === id; })[0] || null;
    }

    function plotById(id) {
      return plots.filter(function (plot) { return plot.id === id; })[0] || null;
    }

    function cameraPowerKey(slot) {
      return String(slot);
    }

    function isScreenPowered(slot) {
      return power[cameraPowerKey(slot)] !== false;
    }

    function setScreenPower(slot, on) {
      power[cameraPowerKey(slot)] = !!on;
      saveJson(POWER_KEY, power);
    }

    function alarmCountForCamera(cam) {
      if (!cam) return 0;
      return alarms.filter(function (alarm) {
        if (alarm.status === '已处理') return false;
        return alarm.deviceId === cam.id || (!alarm.deviceId && alarm.plotId && alarm.plotId === cam.plotId);
      }).length;
    }

    function latestAlarmForCamera(cam) {
      if (!cam) return null;
      return alarms.filter(function (alarm) {
        if (alarm.status === '已处理') return false;
        return alarm.deviceId === cam.id || (!alarm.deviceId && alarm.plotId && alarm.plotId === cam.plotId);
      })[0] || null;
    }

    function buildScreens(targetCameraId) {
      var used = {};
      screens = [];
      for (var i = 0; i < SCREEN_COUNT; i++) {
        var bound = bindings[String(i)];
        var cam = bound ? cameraById(bound) : null;
        if (!cam) {
          cam = cameras.filter(function (c) { return !used[c.id]; })[0] || null;
          if (cam) bindings[String(i)] = cam.id;
        }
        if (cam) used[cam.id] = true;
        screens.push({
          slot: i,
          camera: cam,
          status: targetCameraId && cam && cam.id === targetCameraId ? 'connecting' : 'idle',
          seq: 0,
          useProxy: false,
          timer: null
        });
      }
      saveJson(BINDING_KEY, bindings);
    }

    function renderMonitorWall(targetCameraId) {
      var wall = document.getElementById('monitorWall');
      wall.innerHTML = screens.map(function (screen) {
        var cam = screen.camera;
        var powered = isScreenPowered(screen.slot);
        var alarmCount = alarmCountForCamera(cam);
        var alarm = latestAlarmForCamera(cam);
        var statusText = !cam ? '连接失败' : (!powered ? '已关闭' : (screen.status === 'live' ? '连接成功' : (screen.status === 'connecting' ? '正在连接' : '连接失败')));
        return '<article class="monitor-tile ' + (screen.status === 'live' && powered ? 'is-live' : '') + (!powered ? ' is-off' : '') + '" data-slot="' + screen.slot + '">' +
          '<div class="monitor-frame">' +
            '<img id="cameraImg' + screen.slot + '" alt="监控屏 ' + (screen.slot + 1) + '">' +
            '<iframe id="cameraFrame' + screen.slot + '" title="监控屏 ' + (screen.slot + 1) + '" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>' +
            '<div class="camera-placeholder" id="cameraPlaceholder' + screen.slot + '">' +
              '<div class="placeholder-title">' + esc(statusText) + '</div>' +
              '<div class="placeholder-sub">' + esc(cam ? cam.ip + ':' + cam.port : '未绑定或未连接摄像头，点击添加摄像头设备。') + '</div>' +
            '</div>' +
            '<div class="monitor-hud"><span class="live-dot"></span><span>' + esc(statusText) + '</span></div>' +
            '<div class="monitor-screen-no">屏幕 ' + (screen.slot + 1) + '</div>' +
          '</div>' +
          '<div class="monitor-meta">' +
            '<div><b>' + esc(cam ? cam.name : '未绑定摄像头') + '</b><span>' + esc(cam ? ((cam.plotName || '-') + ' · ' + (cam.protocol || 'mjpeg').toUpperCase()) : '点击画面添加') + '</span></div>' +
            '<div class="monitor-actions">' +
              '<button class="btn btn-outline btn-sm" data-power="' + screen.slot + '" data-action="on" type="button">开</button>' +
              '<button class="btn btn-outline btn-sm" data-power="' + screen.slot + '" data-action="off" type="button">关</button>' +
            '</div>' +
          '</div>' +
          '<div class="monitor-alarm ' + (alarmCount ? 'has-alarm' : '') + '">' +
            (alarmCount ? ('未处理告警 ' + alarmCount + ' 条 · ' + esc((alarm && alarm.type) || '告警')) : '当前无未处理告警') +
          '</div>' +
        '</article>';
      }).join('');
      bindMonitorTileEvents();
      screens.forEach(function (screen) {
        if (screen.camera && isScreenPowered(screen.slot)) {
          attachScreenStream(screen, !!targetCameraId && screen.camera.id === targetCameraId);
        }
      });
      fillControlSelect();
    }

    function bindMonitorTileEvents() {
      document.querySelectorAll('.monitor-tile').forEach(function (tile) {
        tile.addEventListener('click', function () {
          var slot = Number(tile.getAttribute('data-slot'));
          var screen = screens[slot];
          if (!screen || !screen.camera || screen.status !== 'live' || !isScreenPowered(slot)) {
            openCameraAddModal(slot);
            return;
          }
          openCameraZoom(screen);
        });
      });
      document.querySelectorAll('[data-power]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          setCameraPower(Number(btn.getAttribute('data-power')), btn.getAttribute('data-action') === 'on', false, false);
        });
      });
    }

    function setScreenPlaceholder(slot, title, sub, loading) {
      var p = document.getElementById('cameraPlaceholder' + slot);
      var tile = document.querySelector('[data-slot="' + slot + '"]');
      if (!p || !tile) return;
      p.style.display = 'grid';
      p.innerHTML =
        (loading ? '<div class="mini-spinner"></div>' : '') +
        '<div class="placeholder-title">' + esc(title) + '</div>' +
        '<div class="placeholder-sub">' + esc(sub || '') + '</div>';
      tile.classList.toggle('is-live', false);
      tile.classList.toggle('is-connecting', !!loading);
      tile.classList.toggle('is-off', title === '已关闭');
      var hud = tile.querySelector('.monitor-hud span:last-child');
      if (hud) hud.textContent = title;
    }

    function hideScreenPlaceholder(slot) {
      var p = document.getElementById('cameraPlaceholder' + slot);
      var tile = document.querySelector('[data-slot="' + slot + '"]');
      if (p) p.style.display = 'none';
      if (tile) {
        tile.classList.add('is-live');
        tile.classList.remove('is-connecting', 'is-off');
        var hud = tile.querySelector('.monitor-hud span:last-child');
        if (hud) hud.textContent = '连接成功';
      }
    }

    function updateAlarmBadges() {
      screens.forEach(function (screen) {
        var tile = document.querySelector('[data-slot="' + screen.slot + '"]');
        if (!tile) return;
        var alarmBox = tile.querySelector('.monitor-alarm');
        if (!alarmBox) return;
        var count = alarmCountForCamera(screen.camera);
        var alarm = latestAlarmForCamera(screen.camera);
        alarmBox.classList.toggle('has-alarm', count > 0);
        alarmBox.textContent = count ? ('未处理告警 ' + count + ' 条 · ' + ((alarm && alarm.type) || '告警')) : '当前无未处理告警';
      });
    }

    function stopScreenStream(screen) {
      if (!screen) return;
      clearInterval(screen.timer);
      screen.timer = null;
      screen.seq += 1;
      var img = document.getElementById('cameraImg' + screen.slot);
      if (img) {
        img.onload = null;
        img.onerror = null;
        img.removeAttribute('src');
        img.style.display = '';
      }
      var frame = document.getElementById('cameraFrame' + screen.slot);
      if (frame) {
        frame.onload = null;
        frame.removeAttribute('src');
        frame.style.display = 'none';
      }
    }

    function attachScreenStream(screen, showConnecting) {
      var cam = screen.camera;
      var img = document.getElementById('cameraImg' + screen.slot);
      var frame = document.getElementById('cameraFrame' + screen.slot);
      if (!cam || !img) return;
      stopScreenStream(screen);
      screen.status = 'connecting';
      screen.useProxy = false;
      if (showConnecting) setScreenPlaceholder(screen.slot, '正在连接', cam.ip + ':' + cam.port, true);
      if (String(cam.protocol || 'mjpeg').toLowerCase() === 'rtsp') {
        screen.status = 'failed';
        setScreenPlaceholder(screen.slot, '连接失败', 'RTSP 需要转码后才能在浏览器播放。', false);
        return;
      }
      if (useCameraPlayer(cam) && frame) {
        img.style.display = 'none';
        frame.style.display = 'block';
        frame.onload = function () {
          screen.status = 'live';
          hideScreenPlaceholder(screen.slot);
        };
        frame.src = cameraPlayerUrl(cam);
        return;
      }
      function attach(showProxyHint) {
        var seq = ++screen.seq;
        if (showProxyHint) setScreenPlaceholder(screen.slot, '正在连接', cam.ip + ':' + cam.port, true);
        img.onload = function () {
          if (seq !== screen.seq) return;
          screen.status = 'live';
          hideScreenPlaceholder(screen.slot);
        };
        img.onerror = function () {
          if (seq !== screen.seq) return;
          if (!screen.useProxy) {
            screen.useProxy = true;
            setScreenPlaceholder(screen.slot, '正在切换备用通道', '直连失败，正在使用同源代理。', true);
            attach(false);
            return;
          }
          screen.status = 'failed';
          setScreenPlaceholder(screen.slot, '连接失败', '请检查协议、账号密码、IP、端口和手机摄像头服务。', false);
        };
        img.src = cameraUrl(cam, screen.useProxy);
      }
      attach(showConnecting);
    }

    function setCameraPower(slot, on, quiet, skipAdd) {
      var screen = screens[slot];
      if (!screen) return;
      setScreenPower(slot, on);
      if (!on) {
        stopScreenStream(screen);
        screen.status = 'off';
        setScreenPlaceholder(slot, '已关闭', '该屏幕摄像头已关闭，可从总控或屏幕按钮重新开启。', false);
        if (screen.camera) API.saveDetectionSettings({ deviceId: screen.camera.id, enabled: false, confidenceThreshold: 0.5, cooldownSeconds: 30 }).catch(function () {});
        if (!quiet) Toast.success('摄像头已关闭');
        return;
      }
      if (!screen.camera) {
        if (!skipAdd) openCameraAddModal(slot);
        return;
      }
      API.saveDetectionSettings({ deviceId: screen.camera.id, enabled: true, confidenceThreshold: 0.5, cooldownSeconds: 30 }).catch(function () {});
      startWorker(false);
      attachScreenStream(screen, true);
      if (!quiet) Toast.success('摄像头正在连接');
    }

    function setSelectedPower(on) {
      var value = document.getElementById('cameraControlSelect').value;
      if (value === 'all') {
        screens.forEach(function (screen) { setCameraPower(screen.slot, on, true, true); });
        Toast.success(on ? '已开启全部已绑定摄像头' : '已关闭全部摄像头');
        return;
      }
      setCameraPower(Number(value), on, false, false);
    }

    function fillControlSelect() {
      var sel = document.getElementById('cameraControlSelect');
      var value = sel.value || 'all';
      sel.innerHTML = '<option value="all">全部摄像头</option>' + screens.map(function (screen) {
        var cam = screen.camera;
        return '<option value="' + screen.slot + '">屏幕 ' + (screen.slot + 1) + ' · ' + esc(cam ? cam.name : '未绑定') + '</option>';
      }).join('');
      sel.value = value;
    }

    function fillPlotSelect() {
      var sel = document.getElementById('cameraPlotSelect');
      sel.innerHTML = '';
      plots.forEach(function (plot) {
        var opt = document.createElement('option');
        opt.value = plot.id;
        opt.textContent = plot.name;
        sel.appendChild(opt);
      });
    }

    function openCameraAddModal(slot) {
      pendingSlot = slot || 0;
      document.getElementById('cameraAddTitle').textContent = '为屏幕 ' + (pendingSlot + 1) + ' 添加摄像头';
      document.getElementById('cameraNameInput').value = '监控屏' + (pendingSlot + 1) + '摄像头';
      document.getElementById('cameraProtocolInput').value = 'mjpeg';
      document.getElementById('cameraIpInput').value = '';
      document.getElementById('cameraPortInput').value = '';
      document.getElementById('cameraUsernameInput').value = '';
      document.getElementById('cameraPasswordInput').value = '';
      fillPlotSelect();
      document.getElementById('cameraAddHint').textContent = plots.length ? '添加后会立即重新检索连接状态，成功后自动显示画面。' : '不存在地块';
      document.getElementById('cameraAddModal').classList.add('show');
    }

    function closeCameraAddModal() {
      document.getElementById('cameraAddModal').classList.remove('show');
    }

    function confirmCameraAdd() {
      if (!plots.length) {
        Toast.error('不存在地块');
        return;
      }
      var name = document.getElementById('cameraNameInput').value.trim();
      var protocol = document.getElementById('cameraProtocolInput').value;
      var ip = document.getElementById('cameraIpInput').value.trim();
      var port = Number(document.getElementById('cameraPortInput').value);
      var plotId = document.getElementById('cameraPlotSelect').value;
      var plot = plotById(plotId);
      if (!plot) {
        Toast.error('不存在地块');
        return;
      }
      if (!name || !ip || !port || port < 1 || port > 65535) {
        Toast.error('请完整填写名称、IP 和 1-65535 之间的端口');
        return;
      }
      var btn = document.getElementById('confirmCameraAdd');
      btn.disabled = true;
      btn.textContent = '正在添加...';
      setScreenPlaceholder(pendingSlot, '正在连接', ip + ':' + port, true);
      closeCameraAddModal();
      API.addDevice({
        name: name,
        type: '摄像头',
        plotId: plot.id,
        plotName: plot.name,
        protocol: protocol,
        ip: ip,
        port: port,
        username: document.getElementById('cameraUsernameInput').value.trim(),
        password: document.getElementById('cameraPasswordInput').value.trim()
      }).then(function (res) {
        if (!res || res.code !== 0 || !res.data) {
          setScreenPlaceholder(pendingSlot, '连接失败', (res && res.msg) || '摄像头添加失败', false);
          Toast.error((res && res.msg) || '摄像头添加失败');
          return;
        }
        bindings[String(pendingSlot)] = res.data.id;
        setScreenPower(pendingSlot, true);
        saveJson(BINDING_KEY, bindings);
        return API.saveDetectionSettings({ deviceId: res.data.id, enabled: true, confidenceThreshold: 0.5, cooldownSeconds: 30 })
          .catch(function () {})
          .then(function () { return startWorker(false); })
          .then(function () { return loadAll(res.data.id); });
      }).catch(function (e) {
        setScreenPlaceholder(pendingSlot, '连接失败', e.message || '摄像头添加失败', false);
        Toast.error(e.message || '摄像头添加失败');
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = '添加并连接';
      });
    }

    function startWorker(showToast) {
      var btn = document.getElementById('startDetectionWorker');
      btn.disabled = true;
      btn.textContent = '启动中...';
      return API.startDetectionWorker().then(function (res) {
        if (!res || res.code !== 0) {
          if (showToast !== false) Toast.error((res && res.msg) || 'worker 启动失败');
          return false;
        }
        if (showToast !== false) {
          var pid = res.data && res.data.pid ? '（PID ' + res.data.pid + '）' : '';
          Toast.success((res && res.msg ? res.msg : 'worker 已启动') + pid + '；请稍候查看识别状态和告警。');
          setTimeout(function () {
            API.getAlarms({ loader: false }).then(function (alarmRes) {
              alarms = (alarmRes && alarmRes.data) || [];
              updateAlarmBadges();
            }).catch(function () {});
            loadDetectionRecords('');
          }, 1500);
        }
        return true;
      }).catch(function (e) {
        if (showToast !== false) Toast.error(e.message || 'worker 启动失败');
        return false;
      }).finally(function () {
        btn.disabled = false;
        btn.textContent = '启动 worker';
      });
    }

    function enableWorkerForCameras() {
      if (!cameras.length) return Promise.resolve();
      return Promise.all(cameras.map(function (cam) {
        return API.saveDetectionSettings({ deviceId: cam.id, enabled: true, confidenceThreshold: 0.5, cooldownSeconds: 30 }).catch(function () { return null; });
      })).then(function () { return startWorker(false); });
    }

    function loadDetectionRecords(deviceId) {
      var box = document.getElementById('detectionRecordList');
      box.innerHTML = '<div class="empty-state">正在加载识别记录</div>';
      API.getDetectionRecords({
        deviceId: deviceId || '',
        date: document.getElementById('recordDate').value
      }).then(function (res) {
        if (!res || res.code !== 0) {
          box.innerHTML = '<div class="empty-state">' + esc((res && res.msg) || '识别记录加载失败') + '</div>';
          return;
        }
        detectionRecords = res.data || [];
        renderDetectionRecords();
      }).catch(function (e) {
        box.innerHTML = '<div class="empty-state">' + esc(e.message || '识别记录加载失败') + '</div>';
      });
    }

    function renderDetectionRecords() {
      var box = document.getElementById('detectionRecordList');
      if (!detectionRecords.length) {
        box.innerHTML = '<div class="empty-state">暂无人体识别记录</div>';
        return;
      }
      box.innerHTML = detectionRecords.map(function (r) {
        var confidence = r.confidence == null ? '--' : Math.round(Number(r.confidence) * 100) + '%';
        return '<article class="detection-record">' +
          '<button class="record-thumb" data-play="' + esc(r.id) + '" type="button">' +
            '<img src="' + esc(r.snapshotUrl) + '" alt="人体识别截图" onerror="this.remove()">' +
            '<span>播放</span>' +
          '</button>' +
          '<div class="record-main">' +
            '<div class="record-title">' + esc(r.deviceName || r.deviceId) + ' · ' + esc(r.plotName || '-') + '</div>' +
            '<div class="record-meta">' + esc(r.startedAt) + ' - ' + esc(r.endedAt) + '</div>' +
            '<div class="record-tags">' +
              '<span class="badge badge-alarm">人体</span>' +
              '<span class="badge badge-warning">置信度 ' + confidence + '</span>' +
              '<span class="badge badge-normal">' + esc(r.status || '未处理') + '</span>' +
            '</div>' +
          '</div>' +
          '<button class="btn btn-primary btn-sm" data-play="' + esc(r.id) + '" type="button">回放</button>' +
        '</article>';
      }).join('');
      box.querySelectorAll('[data-play]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          openDetectionModal(btn.getAttribute('data-play'));
        });
      });
    }

    function openDetectionModal(id) {
      var rec = detectionRecords.filter(function (r) { return String(r.id) === String(id); })[0];
      if (!rec) {
        API.getDetectionRecord(id).then(function (res) {
          if (!res || res.code !== 0 || !res.data) {
            Toast.error((res && res.msg) || '识别记录不存在');
            return;
          }
          showDetectionModal(res.data);
        });
        return;
      }
      showDetectionModal(rec);
    }

    function showDetectionModal(rec) {
      document.getElementById('detectionModalTitle').textContent = '人体识别回放 #' + rec.id;
      document.getElementById('detectionModalSub').textContent = (rec.plotName || '-') + ' · ' + rec.startedAt + ' · 置信度 ' + (rec.confidence == null ? '--' : Math.round(Number(rec.confidence) * 100) + '%');
      var video = document.getElementById('detectionVideo');
      video.src = rec.videoUrl;
      document.getElementById('detectionModal').style.display = 'grid';
    }

    function closeDetectionModal() {
      var video = document.getElementById('detectionVideo');
      video.pause();
      video.removeAttribute('src');
      video.load();
      document.getElementById('detectionModal').style.display = 'none';
    }

    function openCameraZoom(screen) {
      stopZoomStream();
      var cam = screen && screen.camera;
      if (!screen || !cam) return;
      document.getElementById('cameraZoomTitle').textContent = cam.name;
      document.getElementById('cameraZoomSub').textContent = (cam.plotName || '-') + ' · ' + cam.ip + ':' + cam.port;
      document.getElementById('cameraZoomModal').classList.add('show');
      attachZoomStream(screen);
    }

    function stopZoomStream() {
      clearInterval(zoomStream.timer);
      zoomStream.timer = null;
      zoomStream.seq += 1;
      if (zoomStream.movedImg && zoomStream.originalParent) {
        zoomStream.movedImg.classList.remove('monitor-zoom-img');
        zoomStream.originalParent.insertBefore(zoomStream.movedImg, zoomStream.originalParent.firstChild);
        if (zoomStream.screen) {
          zoomStream.screen.status = 'live';
          hideScreenPlaceholder(zoomStream.screen.slot);
        }
      }
      var img = zoomStream.fallbackImg || document.getElementById('cameraZoomImg');
      if (img) {
        img.onload = null;
        img.onerror = null;
        img.removeAttribute('src');
        img.style.display = 'none';
        if (img.tagName === 'IFRAME' && img.parentNode) img.parentNode.removeChild(img);
      }
      zoomStream.screen = null;
      zoomStream.movedImg = null;
      zoomStream.originalParent = null;
      zoomStream.fallbackImg = null;
    }

    function attachZoomStream(screen) {
      var cam = screen.camera;
      var liveImg = document.getElementById('cameraImg' + screen.slot);
      var frame = document.querySelector('.zoom-camera-frame');
      var fallbackImg = document.getElementById('cameraZoomImg');
      var placeholder = document.getElementById('cameraZoomPlaceholder');
      var tilePlaceholder = document.getElementById('cameraPlaceholder' + screen.slot);
      if (liveImg && liveImg.getAttribute('src')) {
        zoomStream.screen = screen;
        zoomStream.movedImg = liveImg;
        zoomStream.originalParent = liveImg.parentNode;
        zoomStream.fallbackImg = fallbackImg;
        fallbackImg.style.display = 'none';
        liveImg.classList.add('monitor-zoom-img');
        frame.insertBefore(liveImg, placeholder);
        placeholder.style.display = 'none';
        if (tilePlaceholder) {
          tilePlaceholder.style.display = 'grid';
          tilePlaceholder.innerHTML =
            '<div class="placeholder-title">正在放大查看</div>' +
            '<div class="placeholder-sub">' + esc(cam.name) + '</div>';
        }
        return;
      }
      var img = fallbackImg;
      img.style.display = 'block';
      if (useCameraPlayer(cam)) {
        var frameEl = document.createElement('iframe');
        frameEl.className = 'monitor-zoom-frame';
        frameEl.title = cam.name;
        frameEl.allow = 'autoplay; fullscreen';
        frameEl.referrerPolicy = 'no-referrer';
        frameEl.src = cameraPlayerUrl(cam);
        frame.insertBefore(frameEl, placeholder);
        placeholder.style.display = 'none';
        zoomStream.fallbackImg = frameEl;
        return;
      }
      zoomStream.useProxy = false;
      function show(title, sub, loading) {
        placeholder.style.display = 'grid';
        placeholder.innerHTML =
          (loading ? '<div class="mini-spinner"></div>' : '') +
          '<div class="placeholder-title">' + esc(title) + '</div>' +
          '<div class="placeholder-sub">' + esc(sub || '') + '</div>';
      }
      function attach() {
        var seq = ++zoomStream.seq;
        show('正在连接摄像头', cam.ip + ':' + cam.port, true);
        img.onload = function () {
          if (seq === zoomStream.seq) placeholder.style.display = 'none';
        };
        img.onerror = function () {
          if (seq !== zoomStream.seq) return;
          if (!zoomStream.useProxy) {
            zoomStream.useProxy = true;
            show('正在切换备用通道', '直连失败，正在使用同源代理。', true);
            attach();
            return;
          }
          show('连接失败', '请检查摄像头连接。', false);
        };
        img.src = cameraUrl(cam, zoomStream.useProxy);
      }
      attach();
    }

    function closeCameraZoom() {
      stopZoomStream();
      document.getElementById('cameraZoomModal').classList.remove('show');
    }

    function stopAllStreams() {
      stopZoomStream();
      screens.forEach(stopScreenStream);
    }

    function loadAll(targetCameraId) {
      stopAllStreams();
      document.getElementById('monitorWall').innerHTML = '<div class="empty-state monitor-loading">正在加载监控大屏</div>';
      return Promise.all([
        API.getPlots({ loader: false }).catch(function () { return { code: 1, data: [] }; }),
        API.getDevices({ loader: false }).catch(function () { return { code: 1, data: [] }; }),
        API.getAlarms({ loader: false }).catch(function () { return { code: 1, data: [] }; })
      ]).then(function (res) {
        plots = (res[0].data || []);
        cameras = (res[1].data || []).filter(function (d) { return d.type === '摄像头'; });
        alarms = (res[2].data || []);
        buildScreens(targetCameraId);
        renderMonitorWall(targetCameraId);
        loadDetectionRecords('');
        if (initialRecordId) {
          openDetectionModal(initialRecordId);
          initialRecordId = null;
        }
      }).catch(function (e) {
        document.getElementById('monitorWall').innerHTML = '<div class="empty-state monitor-loading">' + esc(e.message || '监控大屏加载失败') + '</div>';
      });
    }

    document.getElementById('powerOnCamera').addEventListener('click', function () { setSelectedPower(true); });
    document.getElementById('powerOffCamera').addEventListener('click', function () { setSelectedPower(false); });
    document.getElementById('reloadCamera').addEventListener('click', function () { loadAll(); });
    document.getElementById('reloadDetection').addEventListener('click', function () {
      API.getAlarms({ loader: false }).then(function (res) {
        alarms = (res && res.data) || [];
        updateAlarmBadges();
      });
      loadDetectionRecords('');
    });
    document.getElementById('startDetectionWorker').addEventListener('click', function () { startWorker(true); });
    document.getElementById('recordDate').addEventListener('change', function () { loadDetectionRecords(''); });
    document.getElementById('clearRecordDate').addEventListener('click', function () {
      document.getElementById('recordDate').value = '';
      loadDetectionRecords('');
    });
    document.getElementById('cancelCameraAdd').addEventListener('click', closeCameraAddModal);
    document.getElementById('confirmCameraAdd').addEventListener('click', confirmCameraAdd);
    document.getElementById('cameraAddModal').addEventListener('click', function (e) {
      if (e.target === this) closeCameraAddModal();
    });
    document.getElementById('closeCameraZoom').addEventListener('click', closeCameraZoom);
    document.getElementById('cameraZoomModal').addEventListener('click', function (e) {
      if (e.target === this) closeCameraZoom();
    });
    document.getElementById('closeDetectionModal').addEventListener('click', closeDetectionModal);
    document.getElementById('detectionModal').addEventListener('click', function (e) {
      if (e.target === this) closeDetectionModal();
    });
    window.addEventListener('beforeunload', stopAllStreams);

    loadAll();
    setInterval(function () {
      API.getAlarms({ loader: false }).then(function (res) {
        alarms = (res && res.data) || [];
        updateAlarmBadges();
      }).catch(function () {});
    }, 15000);
  </script>
</body>
</html>
