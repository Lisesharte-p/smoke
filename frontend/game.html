<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>农场保卫战 - 智慧农业平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .pvz-page {
      --pvz-ink: #332112;
      --pvz-paper: #f4d58b;
      --pvz-wood: #8a4f25;
      --pvz-leaf: #2f7d48;
      --pvz-lime: #7bd557;
      --pvz-sky: #82c7ef;
      --pvz-alert: #c0392b;
      --pvz-panel: rgba(38, 28, 17, .82);
      color: #f9f6df;
    }

    .pvz-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      align-items: start;
    }

    .pvz-hud {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .pvz-stat,
    .pvz-panel {
      border: 2px solid rgba(255, 228, 153, .34);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 244, 190, .12), transparent 42%),
        linear-gradient(135deg, rgba(77, 47, 22, .92), rgba(29, 45, 33, .9));
      box-shadow: 0 14px 34px rgba(0, 0, 0, .26);
    }

    .pvz-stat {
      min-height: 72px;
      padding: 12px 14px;
    }

    .pvz-stat .label,
    .pvz-small-label {
      color: rgba(255, 245, 205, .74);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .pvz-stat .value {
      margin-top: 8px;
      color: #fff2a8;
      font-size: 25px;
      line-height: 1;
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(61, 34, 11, .7);
    }

    .stage-wrap {
      min-width: 0;
      padding-bottom: 8px;
    }

    .stage-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 236px;
      gap: 16px;
      align-items: start;
    }

    .stage-scale-frame {
      width: calc(800px * var(--stage-scale, 1));
      height: calc(600px * var(--stage-scale, 1));
      overflow: visible;
    }

    .battle-record-panel {
      min-height: 260px;
      padding: 14px;
    }

    .battle-record-panel .event-lines {
      max-height: 620px;
      overflow-y: auto;
    }

    .pvz-stage {
      transform: scale(var(--stage-scale, 1));
      transform-origin: top left;
      position: relative;
      width: 800px;
      height: 600px;
      overflow: hidden;
      border: 3px solid #51321c;
      border-radius: 8px;
      background: #456c35 url("assets/pvz/images/Background_0.png") center / cover no-repeat;
      box-shadow: 0 22px 48px rgba(0, 0, 0, .34);
      user-select: none;
    }

    .pvz-stage.menu-mode {
      background: #1b2a22 url("assets/pvz/images/MainMenu.png") center / cover no-repeat;
    }

    .pvz-stage.menu-mode .sun-bank,
    .pvz-stage.menu-mode .seed-bank,
    .pvz-stage.menu-mode .shovel-bank,
    .pvz-stage.menu-mode .level-banner,
    .pvz-stage.menu-mode #stageLayer {
      display: none;
    }

    .menu-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: url("assets/pvz/images/MainMenu.png") center / cover no-repeat;
    }

    .start-adventure {
      position: absolute;
      left: 384px;
      top: 72px;
      width: 360px;
      height: 156px;
      padding: 0;
      border: 0;
      background: url("assets/pvz/images/Buttons/SelectorScreen_Adventure_button.png") center / contain no-repeat;
      cursor: pointer;
      filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .22));
    }

    .start-adventure:hover,
    .start-adventure:focus-visible {
      background-image: url("assets/pvz/images/Buttons/SelectorScreen_Adventure_highlight.png");
      outline: none;
    }

    .sun-bank {
      position: absolute;
      left: 8px;
      top: 0;
      width: 76px;
      height: 87px;
      background: url("assets/pvz/images/sun_count.png") center / contain no-repeat;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 13px;
      color: #2f1c0d;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 0 1px rgba(255, 255, 255, .4);
      z-index: 8;
    }

    .seed-bank {
      position: absolute;
      left: 90px;
      top: 8px;
      height: 70px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
      z-index: 9;
    }

    .shovel-bank {
      position: absolute;
      left: 596px;
      top: 0;
      width: 84px;
      height: 80px;
      z-index: 9;
      border: 0;
      padding: 0;
      background: url("assets/pvz/images/ShovelBank.png") center / contain no-repeat;
      cursor: pointer;
      filter: drop-shadow(0 8px 6px rgba(0, 0, 0, .2));
    }

    .shovel-bank img {
      position: absolute;
      left: 13px;
      top: 5px;
      width: 62px;
      height: 62px;
      object-fit: contain;
      transition: transform .16s ease, filter .16s ease;
    }

    .shovel-bank:hover img,
    .shovel-bank.active img {
      transform: translateY(-7px) rotate(-8deg);
      filter: drop-shadow(0 0 8px rgba(255, 239, 155, .9));
    }

    .pvz-stage.shovel-mode .grid-cell {
      cursor: url("assets/pvz/images/Shovel.png") 32 32, pointer;
    }

    .seed-card {
      position: relative;
      width: 50px;
      height: 70px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transition: transform .12s ease, filter .12s ease;
    }

    .seed-card img {
      width: 50px;
      height: 70px;
      display: block;
      image-rendering: auto;
    }

    .seed-card::after {
      content: attr(data-cost);
      position: absolute;
      left: 4px;
      right: 4px;
      bottom: 3px;
      height: 14px;
      color: #22150c;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 1px rgba(255, 255, 255, .45);
    }

    .seed-card:hover,
    .seed-card.selected {
      transform: translateY(-5px);
      filter: drop-shadow(0 0 8px rgba(255, 238, 129, .9));
    }

    .seed-card:disabled {
      cursor: not-allowed;
      filter: grayscale(1) brightness(.52);
      transform: none;
    }

    .level-banner {
      position: absolute;
      right: 14px;
      top: 12px;
      min-width: 154px;
      padding: 8px 12px;
      border: 2px solid rgba(255, 226, 126, .66);
      border-radius: 8px;
      background: rgba(52, 31, 15, .78);
      color: #ffe99a;
      font-size: 13px;
      font-weight: 900;
      text-align: center;
      z-index: 8;
    }

    .battle-grid {
      position: absolute;
      left: 36px;
      top: 78px;
      width: 720px;
      height: 500px;
      z-index: 3;
    }

    .grid-cell {
      position: absolute;
      width: 80px;
      height: 100px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, .08);
      background: transparent;
      cursor: pointer;
    }

    .grid-cell:hover {
      outline: 2px solid rgba(255, 238, 129, .85);
      outline-offset: -2px;
      background: rgba(255, 235, 127, .12);
    }

    .grid-cell.selected-row {
      background: rgba(255, 238, 129, .1);
    }

    .row-tag {
      position: absolute;
      left: 38px;
      width: 130px;
      min-height: 32px;
      padding: 4px 8px;
      border: 1px solid rgba(255, 232, 153, .45);
      border-radius: 8px;
      background: rgba(52, 31, 15, .78);
      color: #fff7ca;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.25;
      z-index: 7;
      pointer-events: none;
    }

    .row-tag span {
      display: block;
      color: rgba(255, 247, 202, .72);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plant,
    .zombie,
    .sun-token {
      position: absolute;
      z-index: 6;
      pointer-events: none;
      image-rendering: auto;
      filter: drop-shadow(0 9px 5px rgba(0, 0, 0, .24));
    }

    .plant {
      width: 72px;
      height: 72px;
      object-fit: contain;
      animation: plant-idle 1.4s ease-in-out infinite;
    }

    .plant.removing {
      animation: plant-remove .48s ease-in forwards;
    }

    .plant.wallnut {
      width: 70px;
      height: 80px;
    }

    .plant.potatomine {
      width: 68px;
      height: 54px;
    }

    .plant.squash {
      width: 78px;
      height: 70px;
      pointer-events: auto;
      cursor: pointer;
    }

    .plant.squash:hover,
    .plant.squash:focus-visible {
      filter: drop-shadow(0 0 10px rgba(255, 239, 128, .92));
      outline: none;
    }

    .plant.bomb {
      width: 74px;
      height: 62px;
    }

    .plant.chomper {
      width: 100px;
      height: 88px;
    }

    .zombie {
      width: 116px;
      height: 101px;
      object-fit: contain;
      transform-origin: 44% 82%;
      animation: zombie-step 1.55s ease-in-out infinite;
      pointer-events: auto;
      cursor: help;
    }

    .sun-token {
      width: 46px;
      height: 46px;
      animation: sun-spin 3.2s linear infinite;
      cursor: pointer;
      pointer-events: auto;
    }

    .ghost-plant {
      position: absolute;
      width: 74px;
      height: 74px;
      object-fit: contain;
      opacity: .58;
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255, 247, 155, .7));
    }

    .blast {
      position: absolute;
      width: 142px;
      height: 142px;
      border-radius: 50%;
      z-index: 11;
      pointer-events: none;
      background:
        radial-gradient(circle, rgba(255, 251, 176, .98) 0 14%, rgba(255, 147, 45, .94) 15% 34%, rgba(207, 49, 31, .76) 35% 51%, rgba(207, 49, 31, 0) 70%),
        radial-gradient(circle, rgba(255, 255, 255, .7), transparent 48%);
      box-shadow: 0 0 28px rgba(255, 91, 24, .72);
      animation: blast-pop .82s ease-out both;
    }

    .blast.cherry {
      width: 210px;
      height: 210px;
      box-shadow: 0 0 38px rgba(255, 64, 24, .82), 0 0 90px rgba(255, 194, 79, .35);
      animation-duration: .98s;
    }

    .blast::after {
      content: "";
      position: absolute;
      inset: -14px;
      border: 4px solid rgba(255, 240, 137, .68);
      border-radius: inherit;
      animation: shockwave .82s ease-out both;
    }

    .stage-toast {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      max-width: 520px;
      padding: 9px 14px;
      border: 2px solid rgba(255, 226, 126, .7);
      border-radius: 8px;
      background: rgba(48, 28, 12, .86);
      color: #fff2a8;
      font-size: 14px;
      font-weight: 900;
      text-align: center;
      z-index: 12;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .stage-toast.show {
      opacity: 1;
    }

    .advice-box {
      position: absolute;
      left: 50%;
      top: 106px;
      width: min(470px, calc(100% - 48px));
      transform: translateX(-50%);
      padding: 14px 42px 14px 16px;
      border: 2px solid rgba(255, 226, 126, .7);
      border-radius: 10px;
      background: rgba(32, 55, 35, .95);
      box-shadow: 0 14px 32px rgba(0, 0, 0, .42);
      color: #fff7ca;
      font-size: 13px;
      line-height: 1.55;
      z-index: 13;
    }

    .advice-box[hidden] { display: none; }
    .advice-box strong { display: block; margin-bottom: 5px; color: #fff0a6; font-size: 14px; }
    .advice-close { position: absolute; right: 8px; top: 8px; border: 0; background: transparent; color: #fff0a6; font-size: 20px; cursor: pointer; }
    .advice-action { display: inline-flex; margin-top: 10px; color: #2d2515; background: #f4d58b; border-radius: 5px; padding: 5px 9px; font-weight: 800; text-decoration: none; }

    .pvz-panel {
      padding: 14px;
    }

    .selected-card {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      margin-top: 10px;
      padding: 9px;
      border: 1px solid rgba(255, 226, 126, .36);
      border-radius: 8px;
      background: rgba(18, 37, 32, .62);
    }

    .selected-card:empty {
      display: none;
    }

    .selected-card img {
      width: 42px;
      height: 58px;
      object-fit: contain;
    }

    .selected-card b {
      display: block;
      color: #fff0a6;
      font-size: 14px;
      line-height: 1.2;
    }

    .selected-card span {
      display: block;
      margin-top: 4px;
      color: rgba(255, 247, 202, .72);
      font-size: 12px;
      line-height: 1.35;
    }

    .plot-summary {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .plot-summary-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid rgba(255, 232, 153, .22);
      border-radius: 8px;
      background: rgba(19, 25, 20, .54);
      color: rgba(255, 247, 222, .9);
      font-size: 12px;
      line-height: 1.35;
    }

    .plot-summary-row strong {
      color: #fff2a8;
      font-size: 13px;
    }

    .plot-summary-row em {
      color: rgba(255, 247, 202, .72);
      font-style: normal;
    }

    .plot-summary-row .status {
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(123, 213, 87, .16);
      color: #b8f39d;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .plot-summary-row.warn .status { background: rgba(255, 205, 80, .16); color: #ffd66e; }
    .plot-summary-row.danger .status { background: rgba(230, 91, 73, .18); color: #ff9d8e; }

    .home-link {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 15;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 2px solid rgba(255, 226, 126, .58);
      background: rgba(52, 31, 15, .82);
      color: #ffe99a;
      font-size: 13px;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 10px 16px rgba(0, 0, 0, .18);
    }

    .home-link:hover,
    .home-link:focus-visible {
      outline: none;
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .plot-lines,
    .event-lines,
    .threat-lines {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .plot-line,
    .event-line,
    .threat-line {
      padding: 9px 10px;
      border: 1px solid rgba(255, 232, 153, .22);
      border-radius: 8px;
      background: rgba(19, 25, 20, .54);
      color: rgba(255, 247, 222, .88);
      font-size: 12px;
      line-height: 1.45;
    }

    .plot-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .plot-line b {
      color: #fff2a8;
      font-weight: 900;
      white-space: nowrap;
    }

    .threat-line strong {
      display: block;
      color: #ffd37a;
      font-size: 13px;
    }

    .event-line.success { border-color: rgba(123, 213, 87, .45); }
    .event-line.warn { border-color: rgba(255, 205, 80, .5); }
    .event-line.danger { border-color: rgba(230, 91, 73, .55); }

    .camera-box {
      display: none;
      margin-top: 10px;
      overflow: hidden;
      border: 2px solid rgba(255, 226, 126, .4);
      border-radius: 8px;
      background: #090806;
      aspect-ratio: 16 / 9;
    }

    .camera-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes plant-idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    @keyframes plant-remove {
      from { transform: translateY(0) scale(1); opacity: 1; filter: drop-shadow(0 9px 5px rgba(0, 0, 0, .24)); }
      to { transform: translateY(14px) scale(.72); opacity: 0; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0)); }
    }

    @keyframes zombie-step {
      0%, 100% { transform: rotate(-1deg); }
      25% { transform: translateY(-2px) rotate(1deg); }
      50% { transform: rotate(-.5deg); }
      75% { transform: translateY(-1px) rotate(1deg); }
    }

    @keyframes sun-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes blast-pop {
      0% { transform: scale(.18); opacity: 0; }
      18% { opacity: 1; }
      72% { opacity: .92; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    @keyframes shockwave {
      from { transform: scale(.28); opacity: .85; }
      to { transform: scale(1.4); opacity: 0; }
    }

    @media (max-width: 1260px) {
      .pvz-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 980px) {
      .stage-area {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 820px) {
      .pvz-hud {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .pvz-hud {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-page="game">

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content pvz-page">
        <div class="pvz-hud">
          <div class="pvz-stat">
            <div class="label">风险僵尸</div>
            <div class="value" id="threatValue">--</div>
          </div>
          <div class="pvz-stat">
            <div class="label">在线设备</div>
            <div class="value" id="onlineValue">--</div>
          </div>
        </div>

        <div class="pvz-layout">
          <section class="stage-wrap">
            <div class="stage-area">
              <div class="stage-scale-frame" id="stageScaleFrame">
                <div class="pvz-stage menu-mode" id="pvzStage">
              <div class="seed-bank" id="seedBank"></div>
              <button class="shovel-bank" id="shovelBank" type="button" aria-label="铲除植物">
                <img src="assets/pvz/images/Shovel.png" alt="">
              </button>
              <div class="level-banner" id="levelBanner">单关卡 · 真实农田同步</div>
              <a class="home-link" href="index.html">← 返回首页</a>
              <div id="stageLayer"></div>
              <div class="menu-screen" id="menuScreen">
                <button class="start-adventure" id="startAdventure" type="button" aria-label="开始游戏"></button>
              </div>
              <div class="stage-toast" id="stageToast"></div>
              <section class="advice-box" id="adviceBox" hidden aria-live="polite">
                <button class="advice-close" id="adviceClose" type="button" aria-label="关闭农事建议">×</button>
                <strong>农事建议</strong>
                <div id="adviceText"></div>
                <a class="advice-action" id="adviceAction" hidden></a>
              </section>
                </div>
              </div>
              <aside class="pvz-panel battle-record-panel">
                <div class="pvz-small-label">战斗记录</div>
                <div class="event-lines" id="eventLines"></div>
              </aside>
            </div>
          </section>

          <aside class="pvz-panel">
            <div class="pvz-small-label">地块总览</div>
            <div class="plot-lines" id="plotLines"></div>

            <div class="camera-box" id="cameraBox">
              <img id="cameraImg" alt="摄像头实时画面">
            </div>

            <div class="pvz-small-label" style="margin-top:16px;">当前选择</div>
            <div class="selected-card" id="selectedPlotCard"></div>

            <div class="pvz-small-label" style="margin-top:16px;">当前风险</div>
            <div class="threat-lines" id="threatLines"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    Layout.init();

    var ASSET = 'assets/pvz/';
    var ROWS = 5;
    var COLS = 9;
    var GRASS_LEFT = 36;
    var GRASS_TOP = 78;
    var CELL_W = 80;
    var CELL_H = 100;

    var state = {
      phase: 'menu',
      plots: [],
      devices: [],
      alarms: [],
      thresholds: {},
      realtime: {},
      selectedPlotId: null,
      selectedCard: null,
      tool: 'inspect',
      hoverCell: null,
      targetCell: null,
      placedPlants: [],
      hiddenDevicePlants: [],
      removingMapped: [],
      effects: [],
      nextEffectId: 1,
      frame: 0,
      adviceLoading: false,
      pendingOps: {},
      events: []
    };

    var plantFrames = {
      waterOn: ['images/Peashooter/Peashooter_0.png', 'images/Peashooter/Peashooter_1.png', 'images/Peashooter/Peashooter_2.png', 'images/Peashooter/Peashooter_3.png'],
      advice: ['images/Squash/Squash/Squash-1.png'],
      temperature: ['images/PotatoMine/PotatoMineInit.png'],
      humidity: ['images/WallNut/Wallnut_0.png'],
      light: ['images/Sunflower/Sunflower_0.png', 'images/Sunflower/Sunflower_1.png', 'images/Sunflower/Sunflower_2.png', 'images/Sunflower/Sunflower_3.png'],
      alarmAll: ['images/CherryBomb/CherryBomb-1.png', 'images/CherryBomb/CherryBomb-7.png'],
      camera: ['images/Chomper/Chomper/Chomper_0.png']
    };

    var zombieFrames = {
      normal: ['images/NormalZombie/Zombie/Zombie_0.png', 'images/NormalZombie/Zombie/Zombie_1.png', 'images/NormalZombie/Zombie/Zombie_2.png', 'images/NormalZombie/Zombie/Zombie_3.png'],
      cone: ['images/ConeheadZombie/ConeheadZombie/ConeheadZombie_0.png', 'images/ConeheadZombie/ConeheadZombie/ConeheadZombie_1.png', 'images/ConeheadZombie/ConeheadZombie/ConeheadZombie_2.png', 'images/ConeheadZombie/ConeheadZombie/ConeheadZombie_3.png'],
      bucket: ['images/BucketheadZombie/BucketheadZombie/BucketheadZombie_0.png', 'images/BucketheadZombie/BucketheadZombie/BucketheadZombie_1.png', 'images/BucketheadZombie/BucketheadZombie/BucketheadZombie_2.png', 'images/BucketheadZombie/BucketheadZombie/BucketheadZombie_3.png']
    };

    var cards = [
      { key: 'waterOn', name: '豌豆射手', action: '灌溉设备专属坑位', cost: 50, card: 'images/Cards/card_peashooter.png' },
      { key: 'temperature', name: '土豆雷', action: '温度传感器专属坑位', cost: 0, card: 'images/Cards/card_potatomine.png' },
      { key: 'humidity', name: '坚果墙', action: '湿度传感器专属坑位', cost: 0, card: 'images/Cards/card_wallnut.png' },
      { key: 'light', name: '向日葵', action: '光照传感器专属坑位', cost: 0, card: 'images/Cards/card_sunflower.png' },
      { key: 'camera', name: '大嘴花', action: '视频监控专属坑位', cost: 0, card: 'images/Cards/card_chomper.png' },
      { key: 'alarmAll', name: '樱桃炸弹', action: '清理本行全部告警', cost: 125, card: 'images/Cards/card_cherrybomb.png' }
    ];

    var sounds = {
      select: ASSET + 'sound/seedlift.ogg',
      plant: ASSET + 'sound/plant.ogg',
      buzzer: ASSET + 'sound/buzzer.ogg',
      tap: ASSET + 'sound/tap.ogg',
      siren: ASSET + 'sound/siren.ogg',
      shovel: ASSET + 'sound/shovel.ogg',
      cherry: ASSET + 'sound/cherrybomb.ogg',
      gulp: ASSET + 'sound/gulp.ogg',
      bleep: ASSET + 'sound/bleep.ogg',
      splat: [ASSET + 'sound/splat0.ogg', ASSET + 'sound/splat1.ogg', ASSET + 'sound/splat2.ogg'],
      chomp: [ASSET + 'sound/chomp0.ogg', ASSET + 'sound/chomp1.ogg', ASSET + 'sound/chomp2.ogg'],
      ready: ASSET + 'sound/readysetplant.ogg'
    };

    var music = {
      menu: new Audio(ASSET + 'music/start0.mp3'),
      battle: new Audio(ASSET + 'music/grasswalk0.mp3'),
      current: null,
      unlocked: false
    };

    music.menu.loop = true;
    music.battle.loop = true;
    music.menu.volume = 0.34;
    music.battle.volume = 0.32;

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function img(path) { return ASSET + path; }
    function frame(list) { return img(list[state.frame % list.length]); }

    function playSound(key) {
      try {
        var src = sounds[key];
        if (Array.isArray(src)) src = src[Math.floor(Math.random() * src.length)];
        var audio = new Audio(src);
        audio.volume = key === 'siren' ? 0.18 : 0.28;
        audio.play().catch(function () {});
      } catch (e) {}
    }

    function playMusic(name) {
      var next = music[name];
      if (!next) return;
      if (music.current && music.current !== next) {
        music.current.pause();
        music.current.currentTime = 0;
      }
      music.current = next;
      next.play().then(function () {
        music.unlocked = true;
      }).catch(function () {});
    }

    function unlockMusic() {
      if (music.unlocked) return;
      playMusic(state.phase === 'play' ? 'battle' : 'menu');
    }

    function operationPending(key) { return !!state.pendingOps[key]; }
    function beginOperation(key) {
      if (operationPending(key)) return false;
      state.pendingOps[key] = true;
      return true;
    }
    function finishOperation(key) { delete state.pendingOps[key]; }

    function showStage(text) {
      var el = document.getElementById('stageToast');
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(showStage.timer);
      showStage.timer = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }

    function number(v) {
      if (v === null || v === undefined || v === '' || isNaN(Number(v))) return null;
      return Number(v);
    }

    function metric(plot, key) {
      if (!plot || plot.empty) return null;
      var rt = state.realtime[plot.id] || {};
      var rv = number(rt[key]);
      if (rv !== null) return rv;
      return number(plot[key]);
    }

    function visibleRows() {
      var rows = state.plots.slice(0, ROWS);
      while (rows.length < ROWS) {
        rows.push({ id: '__empty_' + rows.length, name: '待绑定地块', crop: '未接入', area: '--', empty: true });
      }
      return rows;
    }

    function devicesOf(plotId) {
      return state.devices.filter(function (d) { return String(d.plotId) === String(plotId); });
    }

    function deviceByTypes(plotId, types) {
      var list = devicesOf(plotId);
      for (var i = 0; i < list.length; i++) {
        if (types.indexOf(list[i].type) !== -1) return list[i];
      }
      return null;
    }

    function irrigationDevice(plotId) {
      var list = devicesOf(plotId);
      for (var i = 0; i < list.length; i++) {
        if (list[i].controllable || list[i].type === '灌溉设备') return list[i];
      }
      return null;
    }

    function temperatureDevice(plotId) { return deviceByTypes(plotId, ['温度']); }
    function humidityDevice(plotId) { return deviceByTypes(plotId, ['土壤湿度', '湿度']); }
    function lightDevice(plotId) { return deviceByTypes(plotId, ['光照', '亮度']); }
    function cameraDevice(plotId) { return deviceByTypes(plotId, ['摄像头']); }

    var plantSlots = [
      { key: 'advice', col: 0, name: '倭瓜', action: 'AI 农事建议', fixed: true, className: 'squash' },
      { key: 'waterOn', col: 1, name: '豌豆射手', action: '灌溉设备', device: irrigationDevice, running: true },
      { key: 'temperature', col: 2, name: '土豆雷', action: '温度传感器', device: temperatureDevice, className: 'potatomine' },
      { key: 'humidity', col: 3, name: '坚果墙', action: '湿度传感器', device: humidityDevice, className: 'wallnut' },
      { key: 'light', col: 4, name: '向日葵', action: '光照传感器', device: lightDevice },
      { key: 'camera', col: 5, name: '大嘴花', action: '视频监控', device: cameraDevice, className: 'chomper' }
    ];

    function slotForColumn(col) {
      for (var i = 0; i < plantSlots.length; i++) if (plantSlots[i].col === col) return plantSlots[i];
      return null;
    }

    function slotPlant(plot, slot, row) {
      if (!plot || plot.empty || !slot) return null;
      if (slot.fixed) return { key: slot.key, plotId: plot.id, row: row, col: slot.col, virtual: true, fixed: true, title: slot.action, className: slot.className || '' };
      var manual = manualPlantAt({ plotId: plot.id, row: row, col: slot.col });
      if (manual) return manual;
      var device = slot.device(plot.id);
      if (!device || !device.online || (slot.running && !device.running) || isDevicePlantHidden(plot.id, device.id)) return null;
      return { key: slot.key, plotId: plot.id, row: row, col: slot.col, deviceId: device.id, virtual: true, title: device.name + '：已开启', className: slot.className || '' };
    }

    function devicePlantAt(cell) {
      var plot = plotById(cell.plotId);
      var slot = slotForColumn(cell.col);
      return plot && slot ? slotPlant(plot, slot, cell.row) : null;
    }

    function pendingAlarms(plotId) {
      return state.alarms.filter(function (a) { return String(a.plotId) === String(plotId) && a.status === '未处理'; });
    }

    function threat(label, zombie, severity, message, alarmId) {
      return { label: label, zombie: zombie, severity: severity, message: message, alarmId: String(alarmId) };
    }

    function threatsFor(plot) {
      if (!plot || plot.empty) return [];
      return pendingAlarms(plot.id).map(function (alarm) {
        var severe = alarm.level === '严重' || /人体|入侵|离线|严重/.test(alarm.type || '');
        return threat(
          severe ? '铁桶告警僵尸' : '告警僵尸',
          severe ? 'bucket' : 'normal',
          severe ? 22 : 14,
          (alarm.type || '告警') + ' · ' + (alarm.value || '-'),
          alarm.id
        );
      });
    }

    function selectedPlot() {
      var rows = visibleRows();
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].id === state.selectedPlotId) return rows[i];
      }
      return rows[0] || null;
    }

    function cardByKey(key) {
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].key === key) return cards[i];
      }
      return null;
    }

    function cardEnabled(card) {
      var plot = selectedPlot();
      return !!(plot && !plot.empty && card);
    }

    function plotById(plotId) {
      var rows = visibleRows();
      for (var i = 0; i < rows.length; i++) {
        if (String(rows[i].id) === String(plotId)) return rows[i];
      }
      return null;
    }

    function plantClassFor(key) {
      if (key === 'alarmAll') return 'bomb';
      if (key === 'camera') return 'chomper';
      if (key === 'temperature') return 'potatomine';
      if (key === 'humidity') return 'wallnut';
      return '';
    }

    function canPlantOnCell(cell) {
      if (!cell) return false;
      if (cell.col > 5) {
        showStage('植物请种在左侧防线');
        playSound('buzzer');
        return false;
      }
      return true;
    }

    function visibleRowIndex(plotId) {
      var rows = visibleRows();
      for (var i = 0; i < rows.length; i++) {
        if (String(rows[i].id) === String(plotId)) return i;
      }
      return -1;
    }

    function deviceForPlant(key, plot) {
      if (key === 'waterOn') return irrigationDevice(plot.id);
      if (key === 'camera') return cameraDevice(plot.id);
      return null;
    }

    function plantRowKey(plotId, row, key) {
      return String(plotId) + ':' + String(row) + ':' + String(key);
    }

    function manualPlantInRow(plot, row) {
      for (var i = state.placedPlants.length - 1; i >= 0; i--) {
        var plant = state.placedPlants[i];
        if (String(plant.plotId) === String(plot.id) && plant.row === row && !plant.removing) return plant;
      }
      return null;
    }

    function activePlantInRow(plot, row) {
      return manualPlantInRow(plot, row);
    }

    function hasManualPlantTypeInRow(plot, row, key) {
      for (var i = 0; i < state.placedPlants.length; i++) {
        var plant = state.placedPlants[i];
        if (String(plant.plotId) === String(plot.id) && plant.row === row && plant.key === key && !plant.removing) return true;
      }
      return false;
    }

    function hasPlantTypeInRow(plot, row, key) {
      return hasManualPlantTypeInRow(plot, row, key);
    }

    function placePlant(key, plot, cell, title, device) {
      if (!cell || !plot || plot.empty) return null;
      if (manualPlantAt(cell)) {
        playSound('buzzer');
        showStage('这个格子已经种有植物，请先用铲子清除');
        return null;
      }
      var plant = {
        key: key,
        plotId: plot.id,
        row: cell.row,
        col: cell.col,
        deviceId: device ? device.id : null,
        title: title || cardByKey(key).action,
        time: Date.now()
      };
      state.placedPlants.push(plant);
      renderBoard();
      return plant;
    }

    function showAdvice(text, action) {
      var box = document.getElementById('adviceBox');
      var content = document.getElementById('adviceText');
      var link = document.getElementById('adviceAction');
      content.textContent = text;
      if (action && action.text && action.href) {
        link.textContent = action.text;
        link.href = action.href;
        link.hidden = false;
      } else {
        link.textContent = '';
        link.removeAttribute('href');
        link.hidden = true;
      }
      box.hidden = false;
    }

    function requestAdvice(plotId) {
      if (state.adviceLoading) return;
      var plot = plotById(plotId);
      if (!plot || plot.empty) return;
      state.adviceLoading = true;
      var temp = metric(plot, 'temp');
      var hum = metric(plot, 'humidity');
      var lux = metric(plot, 'lux');
      var question = '请给' + plot.name + '的' + (plot.crop || '作物') + '提供一条农事建议。当前温度 ' + (temp === null ? '--' : temp.toFixed(1) + '℃') + '，湿度 ' + (hum === null ? '--' : hum.toFixed(1) + '%') + '，光照 ' + (lux === null ? '--' : Math.round(lux) + ' lx') + '。';
      showAdvice('正在获取农事建议…');
      try {
        API.getChatReply(question).then(function (res) {
          if (!res || res.code !== 0 || !res.data || typeof res.data.answer !== 'string') throw new Error('农事建议返回异常');
          showAdvice(res.data.answer, res.data.action);
        }).catch(function () {
          showAdvice('暂时无法获取农事建议，请稍后再试。');
        }).finally(function () {
          state.adviceLoading = false;
        });
      } catch (e) {
        state.adviceLoading = false;
        showAdvice('暂时无法获取农事建议，请稍后再试。');
      }
    }

    function addEffect(type, row, col) {
      var effect = {
        id: state.nextEffectId++,
        type: type,
        row: row,
        col: col
      };
      state.effects.push(effect);
      renderBoard();
      setTimeout(function () {
        state.effects = state.effects.filter(function (e) { return e.id !== effect.id; });
        if (state.phase === 'play') renderBoard();
      }, type === 'cherry' ? 1050 : 760);
    }

    function addEvent(text, type) {
      state.events.unshift({ text: text, type: type || 'success', time: new Date().toLocaleTimeString('zh-CN', { hour12: false }) });
      state.events = state.events.slice(0, 7);
      renderEvents();
    }

    function manualPlantAt(cell) {
      for (var i = state.placedPlants.length - 1; i >= 0; i--) {
        var p = state.placedPlants[i];
        if (String(p.plotId) === String(cell.plotId) && p.row === cell.row && p.col === cell.col && !p.removing) return p;
      }
      return null;
    }

    function devicePlantKey(plotId, deviceId) {
      return String(plotId) + ':' + String(deviceId);
    }

    function isDevicePlantHidden(plotId, deviceId) {
      return state.hiddenDevicePlants.indexOf(devicePlantKey(plotId, deviceId)) !== -1;
    }

    function hideDevicePlant(plotId, deviceId) {
      var key = devicePlantKey(plotId, deviceId);
      if (state.hiddenDevicePlants.indexOf(key) === -1) state.hiddenDevicePlants.push(key);
    }

    function linkedPlantAt(cell) {
      var plot = plotById(cell.plotId);
      var slot = slotForColumn(cell.col);
      if (!plot || plot.empty || !slot) return null;
      if (slot.fixed) return slotPlant(plot, slot, cell.row);
      var manual = manualPlantAt(cell);
      if (manual) return manual;
      var device = slot.device ? slot.device(plot.id) : null;
      if (!device || !device.online || (slot.running && !device.running)) return null;
      return { key: slot.key, plotId: plot.id, row: cell.row, col: slot.col, deviceId: device.id, virtual: true, title: device.name + '：已开启', className: slot.className || '' };
    }

    function mappedDeviceAt(plot, col) {
      if (!plot || plot.empty) return null;
      if (col === 1) {
        var sensors = devicesOf(plot.id).filter(function (d) { return !d.controllable && d.type !== '摄像头'; });
        return sensors[0] || null;
      }
      if (col === 2) return irrigationDevice(plot.id);
      if (col === 3) return cameraDevice(plot.id);
      return null;
    }

    function setTool(tool) {
      state.tool = tool;
      state.hoverCell = null;
      document.getElementById('pvzStage').classList.toggle('shovel-mode', tool === 'shovel');
      var shovel = document.getElementById('shovelBank');
      if (shovel) shovel.classList.toggle('active', tool === 'shovel');
      if (state.phase === 'play') renderBoard();
    }

    function clearSelection() {
      state.selectedCard = null;
      setTool('inspect');
      renderCards();
    }

    function removeManualPlant(cell, onRemoved) {
      var plant = manualPlantAt(cell);
      if (!plant) return false;
      plant.removing = true;
      playSound('shovel');
      renderBoard();
      setTimeout(function () {
        state.placedPlants = state.placedPlants.filter(function (p) { return p !== plant; });
        if (state.phase === 'play') renderBoard();
        if (onRemoved) onRemoved(plant);
      }, 480);
      return true;
    }

    function clearCell(cell) {
      var plot = plotById(cell.plotId);
      var plant = linkedPlantAt(cell);
      if (!plot || plot.empty || !plant) {
        playSound('buzzer');
        showStage('这里没有可铲除的植物');
        return;
      }

      if (plant.fixed) {
        playSound('buzzer');
        showStage('倭瓜是固定的农事建议标识，不能铲除');
        return;
      }

      function removeLinkedPlant() {
        if (plant.virtual) {
          renderBoard();
          afterRemove();
          return;
        }
        if (plant.row === cell.row && plant.col === cell.col) {
          removeManualPlant(cell, afterRemove);
          return;
        }
        plant.removing = true;
        playSound('shovel');
        renderBoard();
        setTimeout(function () {
          state.placedPlants = state.placedPlants.filter(function (p) { return p !== plant; });
          if (state.phase === 'play') renderBoard();
          afterRemove();
        }, 480);
      }

      function afterRemove() {
        if (plant.virtual && plant.deviceId) hideDevicePlant(plot.id, plant.deviceId);
        if (plant.key === 'camera') hideCamera();
        var slot = slotForColumn(plant.col);
        var deviceName = slot && !slot.fixed ? slot.action : '设备';
        addEvent(deviceName + '已关闭', 'warn');
        showStage(deviceName + '已关闭');
      }

      if (plant.deviceId && plant.key === 'waterOn') {
        var closeKey = 'irrigation:' + plant.deviceId;
        if (!beginOperation(closeKey)) {
          showStage('灌溉设备正在切换，请稍候');
          return;
        }
        API.controlIrrigation(plant.deviceId, 'off').then(function (res) {
          if (res.code !== 0) throw new Error(res.msg || '关闭灌溉设备失败');
          removeLinkedPlant();
          loadAll(false);
        }).catch(function (e) {
          playSound('buzzer');
          addEvent(e.message || '关闭灌溉设备失败', 'danger');
          showStage('设备关闭失败，植物未铲除');
        }).finally(function () {
          finishOperation(closeKey);
        });
        return;
      }

      removeLinkedPlant();
    }

    function renderStats() {
      var rows = visibleRows().filter(function (p) { return !p.empty; });
      var threatCount = 0;
      rows.forEach(function (plot) { threatCount += threatsFor(plot).length; });
      var online = state.devices.filter(function (d) { return d.online; }).length;
      document.getElementById('threatValue').textContent = threatCount;
      document.getElementById('onlineValue').textContent = online + '/' + state.devices.length;
      document.getElementById('levelBanner').textContent = '单关卡 · ' + rows.length + ' 个真实地块';
    }

    function plantSprite(kind, row, col, extraClass, title, plotId) {
      var x = GRASS_LEFT + col * CELL_W + 6;
      var y = GRASS_TOP + row * CELL_H + 18;
      var cls = 'plant ' + (extraClass || '');
      var target = plotId ? ' data-plot="' + esc(plotId) + '" data-row="' + row + '" data-col="' + col + '"' : '';
      var advice = kind === 'advice' ? ' data-advice-plot="' + esc(plotId) + '" tabindex="0" role="button" aria-label="获取农事建议"' : '';
      return '<img class="' + cls + '" src="' + esc(frame(plantFrames[kind])) + '" alt="" title="' + esc(title || '') + '"' + target + advice + ' style="left:' + x + 'px;top:' + y + 'px;">';
    }

    function removingKey(plotId, col) {
      return plotId + ':' + col;
    }

    function isRemovingMapped(plotId, col) {
      return state.removingMapped.indexOf(removingKey(plotId, col)) !== -1;
    }

    function mappedPlantClass(baseClass, plotId, col) {
      return (baseClass ? baseClass + ' ' : '') + (isRemovingMapped(plotId, col) ? 'removing' : '');
    }

    function zombieSprite(kind, row, col, title, alarmId, yOffset) {
      var x = GRASS_LEFT + col * CELL_W - 26;
      var y = GRASS_TOP + row * CELL_H + 6 + (yOffset || 0);
      var delay = -((row * 0.19) + (col * 0.11)).toFixed(2);
      return '<img class="zombie" src="' + esc(frame(zombieFrames[kind])) + '" alt="" data-alarm-id="' + esc(alarmId) + '" data-alert="' + esc(title || '') + '" title="' + esc(title || '') + '" style="left:' + x + 'px;top:' + y + 'px;animation-delay:' + delay + 's;">';
    }

    function showZombieAlert(text) {
      if (text && state.tool === 'inspect') showStage(text);
    }

    function mappedPlants(plot, row) {
      if (!plot || plot.empty) return '';
      var html = '';
      plantSlots.forEach(function (slot) {
        var plant = slotPlant(plot, slot, row);
        if (plant) html += plantSprite(plant.key, row, slot.col, 'device-plant ' + (plant.className || slot.className || ''), plant.title, plot.id);
      });
      return html;
    }

    function placedPlantSprites(row) {
      var html = '';
      state.placedPlants.forEach(function (plant) {
        if (plant.row !== row) return;
        var cls = plantClassFor(plant.key) + (plant.removing ? ' removing' : '');
        html += plantSprite(plant.key, plant.row, plant.col, cls, plant.title, plant.plotId);
      });
      return html;
    }

    function effectSprites(row) {
      var html = '';
      state.effects.forEach(function (effect) {
        if (effect.row !== row) return;
        var size = effect.type === 'cherry' ? 210 : 104;
        var x = GRASS_LEFT + effect.col * CELL_W + (CELL_W - size) / 2;
        var y = GRASS_TOP + effect.row * CELL_H + (CELL_H - size) / 2;
        html += '<div class="blast ' + esc(effect.type) + '" style="left:' + x + 'px;top:' + y + 'px;"></div>';
      });
      return html;
    }

    function renderBoard() {
      var rows = visibleRows();
      var html = '';

      for (var r = 0; r < ROWS; r++) {
        var plot = rows[r];
        var tagTop = GRASS_TOP + r * CELL_H + 8;
        var crop = plot.empty ? '未接入专业版地块' : ((plot.crop || '未设置作物') + ' · 设备 ' + devicesOf(plot.id).length + ' 台');
        html += '<div class="row-tag" style="top:' + tagTop + 'px;">' + esc(plot.name) + '<span>' + esc(crop) + '</span></div>';
        for (var c = 0; c < COLS; c++) {
          var selected = plot.id === state.selectedPlotId ? ' selected-row' : '';
          html += '<button class="grid-cell' + selected + '" type="button" data-plot="' + esc(plot.id) + '" data-row="' + r + '" data-col="' + c + '" style="left:' + (GRASS_LEFT + c * CELL_W) + 'px;top:' + (GRASS_TOP + r * CELL_H) + 'px;"></button>';
        }
        html += mappedPlants(plot, r);
        html += placedPlantSprites(r);

        var threats = threatsFor(plot);
        for (var z = 0; z < threats.length; z++) {
          var zombieTitle = threats[z].label + '：' + threats[z].message;
          var zombieCol = 6 + (z % 3);
          html += zombieSprite(threats[z].zombie, r, zombieCol, zombieTitle, threats[z].alarmId, Math.floor(z / 3) * 18);
        }
        html += effectSprites(r);
      }

      document.getElementById('stageLayer').innerHTML = html;
    }

    function updateStageScale() {
      var area = document.querySelector('.stage-area');
      var frame = document.getElementById('stageScaleFrame');
      var rail = document.querySelector('.battle-record-panel');
      if (!area || !frame || !rail) return;
      var stacked = window.matchMedia('(max-width: 980px)').matches;
      var gap = parseFloat(window.getComputedStyle(area).gap) || 16;
      var available = stacked ? area.clientWidth : area.clientWidth - rail.offsetWidth - gap;
      var scale = Math.min(1.55, Math.max(.65, available / 800));
      frame.style.setProperty('--stage-scale', scale);
      frame.style.width = (800 * scale) + 'px';
      frame.style.height = (600 * scale) + 'px';
    }

    function cellFromElement(el) {
      var cell = el && el.closest ? el.closest('.grid-cell') : null;
      if (!cell || !document.getElementById('stageLayer').contains(cell)) return null;
      return { row: Number(cell.getAttribute('data-row')), col: Number(cell.getAttribute('data-col')), plotId: cell.getAttribute('data-plot') };
    }

    function handleGridClick(cell) {
      if (!cell) return;
      state.targetCell = cell;
      state.selectedPlotId = cell.plotId;
      if (state.tool === 'shovel') {
        clearCell(cell);
      } else if (state.tool === 'plant' && state.selectedCard) {
        applySelectedCard(cell);
      } else {
        renderPanel();
      }
    }

    function bindBoardInteractions() {
      var layer = document.getElementById('stageLayer');
      layer.addEventListener('click', function (event) {
        var squash = event.target.closest && event.target.closest('[data-advice-plot]');
        if (squash && layer.contains(squash)) {
          event.stopPropagation();
          requestAdvice(squash.getAttribute('data-advice-plot'));
          return;
        }
        handleGridClick(cellFromElement(event.target));
      });
      layer.addEventListener('keydown', function (event) {
        var squash = event.target.closest && event.target.closest('[data-advice-plot]');
        if (squash && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          requestAdvice(squash.getAttribute('data-advice-plot'));
        }
      });
      layer.addEventListener('pointerover', function (event) {
        var zombie = event.target.closest && event.target.closest('.zombie');
        if (zombie && layer.contains(zombie)) showZombieAlert(zombie.getAttribute('data-alert'));
        var cell = cellFromElement(event.target);
        if (cell && state.tool === 'plant' && state.selectedCard) state.hoverCell = cell;
      });
      layer.addEventListener('pointerleave', function () { state.hoverCell = null; });
      layer.addEventListener('contextmenu', function (event) {
        event.preventDefault();
        clearSelection();
        renderPanel();
      });
    }

    function renderCards() {
      var bank = document.getElementById('seedBank');
      bank.innerHTML = cards.map(function (card) {
        var active = state.tool === 'plant' && card.key === state.selectedCard ? ' selected' : '';
        return '<button class="seed-card' + active + '" type="button" data-key="' + card.key + '" data-cost="' + card.cost + '" title="' + esc(card.name + ' · ' + card.action) + '">' +
          '<img src="' + esc(img(card.card)) + '" alt="' + esc(card.name) + '">' +
        '</button>';
      }).join('');

      bank.querySelectorAll('.seed-card').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.selectedCard = btn.getAttribute('data-key');
          setTool('plant');
          playSound('select');
          renderAll();
        });
      });
      document.getElementById('shovelBank').classList.toggle('active', state.tool === 'shovel');
    }

    function renderPanel() {
      var plot = selectedPlot();
      var card = cardByKey(state.selectedCard);
      var detail = document.getElementById('plotLines');
      var threats = document.getElementById('threatLines');
      var selected = document.getElementById('selectedPlotCard');

      selected.innerHTML = '';
      if (state.tool === 'plant' && card) {
        selected.innerHTML =
          '<img src="' + esc(img(card.card)) + '" alt="' + esc(card.name) + '">' +
          '<div><b>' + esc(card.name) + '</b><span>' + esc(card.action) + ' · 请放置在' + ((slotForCard(card.key) || {}).col + 1) + '号坑位</span></div>';
      } else if (state.tool === 'shovel') {
        selected.innerHTML =
          '<img src="' + esc(img('images/Shovel.png')) + '" alt="铲子">' +
          '<div><b>铲子</b><span>点击已种植物，关闭其对应设备；倭瓜不可铲除。</span></div>';
      }

      if (!plot || plot.empty) {
        detail.innerHTML = '<div class="plot-line"><span>状态</span><b>未绑定</b></div>';
        threats.innerHTML = '<div class="threat-line"><strong>暂无数据</strong>等待专业版新增地块后同步。</div>';
        hideCamera();
        return;
      }

      var rows = visibleRows().filter(function (p) { return !p.empty; });
      var temp = metric(plot, 'temp');
      var hum = metric(plot, 'humidity');
      var lux = metric(plot, 'lux');
      var devs = devicesOf(plot.id);
      var online = devs.filter(function (d) { return d.online; }).length;
      var alarms = pendingAlarms(plot.id);
      var irrig = irrigationDevice(plot.id);

      detail.innerHTML = rows.map(function (item) {
        var itemTemp = metric(item, 'temp');
        var itemHum = metric(item, 'humidity');
        var itemLux = metric(item, 'lux');
        var itemDevs = devicesOf(item.id);
        var itemOnline = itemDevs.filter(function (d) { return d.online; }).length;
        var itemAlarms = pendingAlarms(item.id).length;
        return '<div class="plot-summary-row">' +
          '<strong>' + esc(item.name) + '</strong>' +
          '<em>湿度 ' + (itemHum === null ? '--' : itemHum.toFixed(1) + '%') + ' · 温度 ' + (itemTemp === null ? '--' : itemTemp.toFixed(1) + '℃') + ' · 亮度 ' + (itemLux === null ? '--' : Math.round(itemLux) + ' lx') + ' · 告警 ' + itemAlarms + '</em>' +
          '<span class="status">' + itemOnline + '/' + itemDevs.length + '</span>' +
        '</div>';
      }).join('');

      var ts = threatsFor(plot);
      threats.innerHTML = ts.length
        ? ts.map(function (t) { return '<div class="threat-line"><strong>' + esc(t.label) + '</strong>' + esc(t.message) + '</div>'; }).join('')
        : '<div class="threat-line"><strong>防线稳定</strong>当前地块没有越阈值风险或未处理告警。</div>';
    }

    function renderEvents() {
      var box = document.getElementById('eventLines');
      if (!state.events.length) {
        box.innerHTML = '<div class="event-line">等待实时数据同步</div>';
        return;
      }
      box.innerHTML = state.events.map(function (e) {
        return '<div class="event-line ' + esc(e.type) + '">' + esc(e.time) + ' · ' + esc(e.text) + '</div>';
      }).join('');
    }

    function renderAll() {
      if (!state.selectedPlotId && state.plots.length) state.selectedPlotId = state.plots[0].id;
      renderStats();
      renderCards();
      if (state.phase === 'play') renderBoard();
      renderPanel();
      renderEvents();
    }

    function startGame() {
      state.phase = 'play';
      state.hoverCell = null;
      setTool('plant');
      document.getElementById('pvzStage').classList.remove('menu-mode');
      document.getElementById('menuScreen').style.display = 'none';
      playMusic('battle');
      playSound('ready');
      renderAll();
      showStage('准备，安放，开战！');
    }

    function spend() {
      return true;
    }

    function refund() {}

    function applySelectedCard(cell) {
      var card = cardByKey(state.selectedCard);
      cell = cell || state.targetCell;
      if (!card || !cell) return;
      var plot = plotById(cell.plotId) || selectedPlot();
      if (!plot || plot.empty) {
        playSound('buzzer');
        showStage('这一行还没有绑定真实地块');
        return;
      }
      if (!canPlantOnCell(cell)) return;
      if (card.key === 'alarmAll') return plantChili(plot, card, cell);

      var slot = slotForColumn(cell.col);
      if (!slot || slot.key !== card.key) {
        playSound('buzzer');
        showStage('请放置在' + ((slotForCard(card.key) || {}).col + 1) + '号坑位');
        return;
      }

      var existing = manualPlantAt(cell);
      if (existing) {
        playSound('buzzer');
        showStage('这个专属坑位已有' + cardByKey(existing.key).name + '，请先用铲子关闭');
        return;
      }

      var device = slot.device ? slot.device(plot.id) : null;
      if (!device || !device.online) {
        playSound('buzzer');
        showStage(device ? device.name + '设备当前离线' : '该地块没有' + card.action);
        return;
      }

      if (card.key === 'waterOn') return plantIrrigation(plot, card, cell);
      if (card.key === 'camera') return plantCamera(plot, card, cell);

      placeDevicePlant(plot, card, cell, device);
    }

    function slotForCard(key) {
      for (var i = 0; i < plantSlots.length; i++) if (plantSlots[i].key === key) return plantSlots[i];
      return null;
    }

    function placeDevicePlant(plot, card, cell, device) {
      if (!placePlant(card.key, plot, cell, '已开启：' + device.name, device)) return;
      playSound('plant');
      addEvent(device.name + '已成功开启', 'success');
      showStage('已成功开启' + device.name);
    }

    function plantIrrigation(plot, card, cell) {
      var dev = irrigationDevice(plot.id);
      if (!dev || !dev.online) {
        playSound('buzzer');
        showStage('该地块没有在线灌溉设备');
        return;
      }
      var openKey = 'irrigation:' + dev.id;
      if (!beginOperation(openKey)) {
        showStage('灌溉设备正在切换，请稍候');
        return;
      }
      if (!spend(card.cost)) {
        finishOperation(openKey);
        return;
      }
      API.controlIrrigation(dev.id, 'on').then(function (res) {
        if (res.code !== 0) throw new Error(res.msg || '开启灌溉设备失败');
        playSound('plant');
        if (!placePlant(card.key, plot, cell, '已开启：' + dev.name, dev)) return;
        addEvent(dev.name + '已成功开启', 'success');
        showStage('已成功开启' + dev.name);
        return loadAll(false);
      }).catch(function (e) {
        refund(card.cost);
        playSound('buzzer');
        addEvent(e.message || '开启灌溉设备失败', 'danger');
        showStage('设备开启失败，未种植植物');
      }).finally(function () {
        finishOperation(openKey);
      });
    }

    function plantCamera(plot, card, cell) {
      var dev = cameraDevice(plot.id);
      if (!dev || !dev.online) {
        playSound('buzzer');
        showStage('该地块没有在线摄像头');
        return;
      }
      if (!spend(card.cost)) return;
      var box = document.getElementById('cameraBox');
      var image = document.getElementById('cameraImg');
      image.src = API.isSimulatorMode() ? API.getSimulatorCameraSource() : 'api/camera/mjpeg?deviceId=' + encodeURIComponent(dev.id) + '&_=' + Date.now();
      box.style.display = 'block';
      playSound('chomp');
      if (!placePlant(card.key, plot, cell, '已启用：' + dev.name, dev)) return;
      addEvent(dev.name + '已成功开启', 'success');
      showStage('已成功开启' + dev.name);
      renderAll();
    }

    function currentHandlerName() {
      var user = window.Layout && Layout.getUser ? Layout.getUser() : null;
      return user ? ((user.roleName || '用户') + '·' + (user.name || user.username || '用户')) : '演示用户';
    }

    function plantChili(plot, card, cell) {
      var row = visibleRowIndex(plot.id);
      if (row < 0) {
        playSound('buzzer');
        showStage('无法定位当前地块所在战场行');
        return;
      }
      var alarms = pendingAlarms(plot.id);
      if (!alarms.length) {
        playSound('buzzer');
        showStage('该地块没有未处理告警');
        return;
      }
      var cherryKey = 'cherry:' + plot.id + ':' + row;
      if (!beginOperation(cherryKey)) {
        showStage('该行报警正在处理中，请稍候');
        return;
      }
      if (!spend(card.cost)) {
        finishOperation(cherryKey);
        return;
      }

      API.resolvePlotAlarms(plot.id, { handler: currentHandlerName() }).then(function (res) {
        if (!res || res.code !== 0) throw new Error((res && res.msg) || '批量处理告警失败');
        var resolved = (res.data && res.data.resolvedAlarmIds) || [];
        if (!resolved.length) throw new Error('该地块告警状态已变化，请刷新后重试');
        playSound('cherry');
        playSound('siren');
        var bomb = { key: card.key, plotId: plot.id, row: row, col: 6, title: '已处理 ' + resolved.length + ' 条告警', time: Date.now() };
        state.placedPlants.push(bomb);
        for (var col = 1; col <= 8; col += 2) addEffect('cherry', row, col);
        return loadAll(false).then(function () {
          renderBoard();
          setTimeout(function () {
            state.placedPlants = state.placedPlants.filter(function (p) { return p !== bomb; });
            if (state.phase === 'play') renderBoard();
          }, 220);
          addEvent(plot.name + ' 樱桃炸弹已处理 ' + resolved.length + ' 条告警', 'success');
          showStage('樱桃炸弹爆炸，告警已同步处理');
        });
      }).catch(function (e) {
        refund(card.cost);
        playSound('buzzer');
        addEvent(e.message || '告警同步失败', 'danger');
        showStage('告警处理失败，僵尸仍保留');
        return loadAll(false);
      }).finally(function () {
        finishOperation(cherryKey);
      });
    }

    function hideCamera() {
      var box = document.getElementById('cameraBox');
      var imgEl = document.getElementById('cameraImg');
      box.style.display = 'none';
      imgEl.removeAttribute('src');
    }

    function loadRealtimeForPlots() {
      return Promise.all(state.plots.slice(0, ROWS).map(function (plot) {
        return API.getRealtime(plot.id).then(function (res) {
          if (res && res.code === 0) state.realtime[plot.id] = res.data || {};
        }).catch(function () {
          state.realtime[plot.id] = {};
        });
      }));
    }

    function loadAll(showToast) {
      return Promise.all([API.getPlots(), API.getDevices(), API.getThresholds(), API.getAlarms()]).then(function (all) {
        state.plots = all[0].data || [];
        state.devices = all[1].data || [];
        state.thresholds = all[2].data || {};
        state.alarms = all[3].data || [];
        if (!state.selectedPlotId && state.plots.length) state.selectedPlotId = state.plots[0].id;
        return loadRealtimeForPlots();
      }).then(function () {
        renderAll();
        if (!state.events.length) addEvent(API.isSimulatorMode() ? '模拟数据已加载到五行草坪' : '真实数据已同步到五行草坪', 'success');
        if (showToast) Toast.success('游戏版数据已刷新');
      }).catch(function (e) {
        addEvent(e.message || '数据同步失败', 'danger');
        Toast.error(e.message || '数据加载失败');
        renderAll();
      });
    }

    setInterval(function () {
      state.frame += 1;
    }, 180);

    setInterval(function () {
      loadAll(false);
    }, 20000);

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) loadAll(false);
    });
    window.addEventListener('focus', function () { loadAll(false); });
    document.getElementById('adviceClose').addEventListener('click', function () {
      document.getElementById('adviceBox').hidden = true;
    });
    document.getElementById('startAdventure').addEventListener('click', startGame);
    bindBoardInteractions();
    if (window.ResizeObserver) new ResizeObserver(updateStageScale).observe(document.querySelector('.stage-area'));
    window.addEventListener('resize', updateStageScale);
    updateStageScale();
    document.addEventListener('pointerdown', unlockMusic, { once: true });
    document.getElementById('shovelBank').addEventListener('click', function () {
      setTool(state.tool === 'shovel' ? 'inspect' : 'shovel');
      playSound('select');
      renderAll();
    });
    playMusic('menu');
    loadAll(false);
  </script>
</body>
</html>
