<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史趋势 - 智慧农业平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page="history">

  <div class="app">
    <!-- 侧边栏：由 layout.js 动态注入 -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <!-- 顶栏：由 layout.js 动态注入 -->
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <!-- 查询工具条 -->
        <div class="card" style="padding:14px 20px;">
          <div class="flex-between items-center" style="flex-wrap:wrap;gap:12px;">
            <div class="flex items-center gap-8">
              <span class="text-secondary" style="font-weight:600">监测地块</span>
              <select class="form-control" id="plotSelect" style="width:220px"></select>
            </div>
            <div class="flex gap-8" id="windowGroup">
              <button class="btn btn-sm btn-outline" data-win="1m">1 分钟</button>
              <button class="btn btn-sm btn-primary" data-win="30m">30 分钟</button>
              <button class="btn btn-sm btn-outline" data-win="24h">24 小时</button>
              <span class="text-muted" style="border-left:1px solid #e5e9e5;margin:0 6px;"></span>
              <button class="btn btn-sm btn-outline" data-days="7">近 7 天</button>
              <button class="btn btn-sm btn-outline" data-days="14">近 14 天</button>
              <button class="btn btn-sm btn-outline" data-days="30">近 30 天</button>
            </div>
          </div>
        </div>

        <!-- 温度趋势 -->
        <div class="card mt-20">
          <div class="card-header">
            <div>
              <div class="card-title">温度趋势</div>
              <div class="card-sub">单位：℃</div>
            </div>
          </div>
          <div id="chartTemp" class="chart-box"></div>
        </div>

        <!-- 湿度趋势 -->
        <div class="card mt-20">
          <div class="card-header">
            <div>
              <div class="card-title">土壤湿度趋势</div>
              <div class="card-sub">单位：%</div>
            </div>
          </div>
          <div id="chartHum" class="chart-box"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    Layout.init();

    var selectedPlotId = null;
    var charts = {};
    // 当前视图：{ key:'window'|'days', val:'1m'|'30m'|'24h' 或天数 }
    var view = { key: 'window', val: '30m' };
    var refreshTimer = null;

    var COLOR_TEMP = '#f59e0b';  // 温度：暖橙
    var COLOR_HUM  = '#3b82f6';  // 湿度：水蓝

    /* ---------- 颜色工具：hex 转 rgba / 面积渐变 ---------- */
    function hexToRgba(hex, a) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    function areaGradient(color) {
      return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: hexToRgba(color, .25) },
        { offset: 1, color: hexToRgba(color, 0) }
      ]);
    }

    /* ---------- ECharts 通用折线图配置（单指标，一轴一图） ---------- */
    function lineOption(title, unit, color, dates, values) {
      return {
        title: { text: title, left: 0, top: 0, textStyle: { fontSize: 13, fontWeight: 600, color: '#1f2937' } },
        tooltip: {
          trigger: 'axis',
          backgroundColor: '#fff',
          borderColor: '#e5e9e5',
          borderWidth: 1,
          padding: [8, 12],
          textStyle: { color: '#1f2937', fontSize: 12 },
          formatter: function (ps) {
            var p = ps[0];
            return p.axisValue + '<br/>' + p.marker + ' ' + p.seriesName + '　' + p.value + unit;
          }
        },
        grid: { left: 8, right: 16, top: 34, bottom: 20, containLabel: true },
        xAxis: {
          type: 'category',
          data: dates,
          boundaryGap: false,
          axisLine: { lineStyle: { color: '#e5e9e5' } },
          axisTick: { show: false },
          axisLabel: { color: '#9ca3af', fontSize: 10, hideOverlap: true }
        },
        yAxis: {
          type: 'value',
          scale: true,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: '#9ca3af', fontSize: 11 },
          splitLine: { lineStyle: { color: '#eef2ee' } }
        },
        series: [{
          name: title,
          type: 'line',
          data: values,
          smooth: true,
          showSymbol: false,
          symbol: 'circle',
          symbolSize: 6,
          lineStyle: { width: 2, color: color },
          itemStyle: { color: color },
          areaStyle: { color: areaGradient(color) },
          animationDuration: 900,
          animationEasing: 'cubicOut'
        }]
      };
    }

    function renderChart(id, option) {
      var dom = document.getElementById(id);
      if (!window.echarts || !dom) return;
      if (!charts[id]) charts[id] = echarts.init(dom);
      charts[id].setOption(option, true);
    }

    window.addEventListener('resize', function () {
      Object.keys(charts).forEach(function (k) { charts[k].resize(); });
    });

    /* ---------- 加载历史曲线 ---------- */
    function loadHistory() {
      if (!selectedPlotId) return;
      var days = (view.key === 'days') ? view.val : null;
      var win  = (view.key === 'window') ? view.val : null;
      API.getHistory(selectedPlotId, days, win).then(function (res) {
        if (!res || res.code !== 0 || !res.data) return;
        var d = res.data;
        renderChart('chartTemp', lineOption('温度（℃）', '℃', COLOR_TEMP, d.dates, d.temp));
        renderChart('chartHum', lineOption('土壤湿度（%）', '%', COLOR_HUM, d.dates, d.humidity));
      });
    }

    /* ---------- 短时窗口实时刷新：1/30 分钟每 5 秒、24 小时每 15 秒 ---------- */
    function startAutoRefresh() {
      stopAutoRefresh();
      if (view.key === 'window') {
        var ms = (view.val === '24h') ? 15000 : 5000;
        refreshTimer = setInterval(loadHistory, ms);
      }
    }
    function stopAutoRefresh() {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    }

    /* ---------- 事件 ---------- */
    document.getElementById('plotSelect').addEventListener('change', function () {
      selectedPlotId = this.value;
      loadHistory();
    });

    document.getElementById('windowGroup').querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var win = btn.getAttribute('data-win');
        view = win
          ? { key: 'window', val: win }
          : { key: 'days', val: parseInt(btn.getAttribute('data-days'), 10) };
        document.getElementById('windowGroup').querySelectorAll('button').forEach(function (b) {
          b.className = 'btn btn-sm ' + (b === btn ? 'btn-primary' : 'btn-outline');
        });
        startAutoRefresh();
        loadHistory();
      });
    });

    /* ---------- 初始化 ---------- */
    API.getPlots().then(function (res) {
      var sel = document.getElementById('plotSelect');
      res.data.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name + '（' + p.crop + '）';
        sel.appendChild(opt);
      });
      selectedPlotId = res.data[0].id;
      startAutoRefresh();
      loadHistory();
    });
  </script>
</body>
</html>
