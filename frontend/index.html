<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据总览 - 智慧农业平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body data-page="dashboard">

  <div class="app">
    <!-- 侧边栏：由 layout.js 动态注入 -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <!-- 顶栏：由 layout.js 动态注入 -->
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <!-- KPI 指标卡片 -->
        <div class="kpi-grid">
          <a class="kpi-card" href="monitoring.html" title="查看数据监测">
            <div class="kpi-icon green">🌾</div>
            <div class="kpi-body">
              <div class="kpi-label">地块总数</div>
              <div class="kpi-value"><span id="kpiPlots">--</span><span class="unit">个</span></div>
              <div class="kpi-trend up">全部接入监测</div>
            </div>
          </a>
          <a class="kpi-card" href="devices.html" title="查看设备管理">
            <div class="kpi-icon blue">📡</div>
            <div class="kpi-body">
              <div class="kpi-label">在线设备</div>
              <div class="kpi-value"><span id="kpiOnline">--</span><span class="unit">台</span></div>
              <div class="kpi-trend up" id="kpiOnlineTrend">在线率 --</div>
            </div>
          </a>
          <a class="kpi-card" href="alarm.html" title="查看告警管理">
            <div class="kpi-icon red">🔔</div>
            <div class="kpi-body">
              <div class="kpi-label">未处理告警</div>
              <div class="kpi-value"><span id="kpiAlarm">--</span><span class="unit">条</span></div>
              <div class="kpi-trend down">请及时处理</div>
            </div>
          </a>
          <a class="kpi-card" href="monitoring.html" title="查看数据监测">
            <div class="kpi-icon orange">🌡️</div>
            <div class="kpi-body">
              <div class="kpi-label">平均温度</div>
              <div class="kpi-value"><span id="kpiTemp">--</span><span class="unit">℃</span></div>
              <div class="kpi-trend up">各地块均值</div>
            </div>
          </a>
        </div>

        <!-- 多地块总览 -->
        <div class="section-title">
          <span>多地块总览</span>
          <button class="btn btn-primary btn-sm" id="openAddPlot" style="margin-left:auto">＋ 添加地块</button>
        </div>
        <div class="plot-grid" id="plotGrid"></div>

        <!-- 实时趋势 + 天气预报 / 农事建议（双栏） -->
        <div class="grid grid-2 mt-20">
          <!-- 左：实时趋势（半宽） -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">实时趋势</div>
                <div class="card-sub">近 7 天温湿度与亮度变化</div>
              </div>
              <div class="flex gap-8">
                <select class="form-control" id="trendPlot" style="width:150px"></select>
                <a class="btn btn-outline btn-sm" href="history.html">📈 历史</a>
              </div>
            </div>
            <div id="chartTemp" style="height:200px"></div>
            <div id="chartHum" style="height:200px;margin-top:8px"></div>
            <div id="chartLux" style="height:200px;margin-top:8px"></div>
          </div>

          <!-- 右：天气预报 + 农事建议 -->
          <div class="grid">
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">天气预报</div>
                  <div class="card-sub">未来 5 天 · 农场本地</div>
                </div>
              </div>
              <div id="weatherNow"></div>
              <div id="weatherForecast"></div>
            </div>

            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">农事建议</div>
                  <div class="card-sub">基于天气与当前环境数据</div>
                </div>
              </div>
              <div id="adviceList"></div>
            </div>
          </div>
        </div>

        <!-- 设备状态 + 实时告警 + 最近操作（三栏） -->
        <div class="grid grid-3 mt-20">
          <!-- 设备状态 -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">设备状态</div>
                <div class="card-sub">在线 / 运行 / 离线占比</div>
              </div>
            </div>
            <div id="deviceChart" style="height:200px"></div>
          </div>

          <!-- 实时告警 -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">实时告警</div>
                <div class="card-sub">最近告警记录</div>
              </div>
              <a class="btn btn-outline btn-sm" href="alarm.html">全部</a>
            </div>
            <div id="alarmPanel"></div>
          </div>

          <!-- 最近操作 -->
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">最近操作</div>
                <div class="card-sub">设备控制日志</div>
              </div>
              <a class="btn btn-outline btn-sm" href="control.html">控制台</a>
            </div>
            <div id="operationLog"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 添加地块弹窗（可选绑定新设备） -->
  <div class="modal-mask" id="addPlotModal">
    <div class="modal">
      <div class="modal-title">添加地块</div>
      <div class="form-group">
        <label class="form-label">地块名称</label>
        <input type="text" class="form-control" id="plotName" placeholder="如：五号大棚">
      </div>
      <div class="form-group">
        <label class="form-label">种植作物</label>
        <input type="text" class="form-control" id="plotCrop" placeholder="如：西瓜">
      </div>
      <div class="form-group">
        <label class="form-label">面积（亩）</label>
        <input type="number" class="form-control" id="plotArea" min="0.1" step="0.1" placeholder="如：2.0">
      </div>
      <div class="form-group">
        <div class="flex-between">
          <label class="form-label" style="margin-bottom:0">绑定设备（可选）</label>
          <button class="btn btn-outline btn-sm" id="addDevRow" type="button">＋ 添加设备</button>
        </div>
        <div id="devRows"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelAddPlot">取消</button>
        <button class="btn btn-primary" id="confirmAddPlot">确认添加</button>
      </div>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    Layout.init();

    // 以下板块用模拟数据，直接渲染（不依赖后端接口）
    renderWeather();
    renderAdvice();
    renderDeviceStatus();
    renderAlarmPanel();
    renderOperationLog();

    var plots = [];
    var devices = [];
    var alarms = [];
    var charts = {};
    var humCharts = [];

    /* 是否可管理地块（添加/删除）：仅 农场管理员 admin / 系统管理员 sysadmin */
    function canManagePlot() {
      var role = Layout.getRole();
      return role === 'admin' || role === 'sysadmin';
    }
    if (!canManagePlot()) {
      var addPlotBtn = document.getElementById('openAddPlot');
      if (addPlotBtn) addPlotBtn.style.display = 'none';
    }

    var COLOR_TEMP = '#fbbf24';  // 温度：暖橙（暗底提亮）
    var COLOR_HUM  = '#38bdf8';  // 湿度：水蓝（暗底提亮）
    var COLOR_LUX  = '#34d399';  // 亮度：翠绿（暗底提亮）

    /* ---------- 颜色工具：hex 转 rgba / 面积渐变 ---------- */
    function hexToRgba(hex, a) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    }
    function areaGradient(color) {
      return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: hexToRgba(color, .25) },
        { offset: 1, color: hexToRgba(color, 0) }
      ]);
    }

    /* ---------- ECharts 通用折线图配置（单指标，一轴一图） ---------- */
    function lineOption(title, unit, color, dates, values) {
      return {
        title: { text: title, left: 0, top: 0, textStyle: { fontSize: 13, fontWeight: 600, color: '#e7efff' } },
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(14, 23, 40, .96)',
          borderColor: 'rgba(52, 211, 153, .35)',
          borderWidth: 1,
          padding: [8, 12],
          textStyle: { color: '#e7efff', fontSize: 12 },
          formatter: function (ps) {
            var p = ps[0];
            return p.axisValue + '<br/>' + p.marker + ' ' + p.seriesName + '　' + p.value + unit;
          }
        },
        grid: { left: 8, right: 16, top: 34, bottom: 20, containLabel: true },
        xAxis: {
          type: 'category',
          data: dates,
          boundaryGap: false,
          axisLine: { lineStyle: { color: 'rgba(148, 163, 184, .25)' } },
          axisTick: { show: false },
          axisLabel: { color: '#64748b', fontSize: 10, hideOverlap: true }
        },
        yAxis: {
          type: 'value',
          scale: true,
          axisLine: { show: false },
          axisTick: { show: false },
          axisLabel: { color: '#64748b', fontSize: 11 },
          splitLine: { lineStyle: { color: 'rgba(148, 163, 184, .08)' } }
        },
        series: [{
          name: title,
          type: 'line',
          data: values,
          smooth: true,
          showSymbol: false,
          symbol: 'circle',
          symbolSize: 6,
          lineStyle: { width: 2, color: color },
          itemStyle: { color: color },
          areaStyle: { color: areaGradient(color) },
          animationDuration: 900,
          animationEasing: 'cubicOut'
        }]
      };
    }

    function renderChart(id, option) {
      var dom = document.getElementById(id);
      if (!window.echarts || !dom) return;
      if (!charts[id]) charts[id] = echarts.init(dom);
      charts[id].setOption(option, true);
    }

    /* ---------- 湿度环形图配置（多地块总览） ---------- */
    function humRingOption(hum) {
      var pct = Math.max(0, Math.min(100, Number(hum) || 0));
      return {
        series: [{
          type: 'pie',
          radius: ['72%', '92%'],
          center: ['50%', '50%'],
          silent: true,
          hoverAnimation: false,
          label: { show: false },
          labelLine: { show: false },
          data: [
            { value: pct, itemStyle: { color: COLOR_HUM } },
            { value: 100 - pct, itemStyle: { color: 'rgba(148, 163, 184, .14)' } }
          ],
          animationDuration: 1200,
          animationEasing: 'cubicOut'
        }]
      };
    }

    function renderHumRings(grid) {
      humCharts.forEach(function (c) { try { c.dispose(); } catch (e) {} });
      humCharts = [];
      if (!window.echarts) return;
      grid.querySelectorAll('.hum-ring-chart').forEach(function (dom) {
        var hum = parseFloat(dom.getAttribute('data-hum'));
        var chart = echarts.init(dom);
        chart.setOption(humRingOption(hum));
        humCharts.push(chart);
      });
    }

    window.addEventListener('resize', function () {
      Object.keys(charts).forEach(function (k) { charts[k].resize(); });
      humCharts.forEach(function (c) { c.resize(); });
    });

    /* ---------- 渲染 KPI ---------- */
    function renderKpi() {
      var online = devices.filter(function (d) { return d.online; }).length;
      var unresolved = alarms.filter(function (a) { return a.status === '未处理'; }).length;
      var avgTemp = plots.length
        ? plots.reduce(function (s, p) { return s + p.temp; }, 0) / plots.length
        : 0;
      var onlineRate = devices.length ? Math.round(online / devices.length * 100) : 0;

      Animate.countUp(document.getElementById('kpiPlots'), plots.length);
      Animate.countUp(document.getElementById('kpiOnline'), online, { suffix: '/' + devices.length });
      document.getElementById('kpiOnlineTrend').textContent = '在线率 ' + onlineRate + '%';
      Animate.countUp(document.getElementById('kpiAlarm'), unresolved);
      Animate.countUp(document.getElementById('kpiTemp'), avgTemp, { decimals: 1 });
    }

    /* ---------- 渲染多地块卡片 ---------- */
    function renderPlotCards() {
      var grid = document.getElementById('plotGrid');
      grid.innerHTML = '';

      var canManage = canManagePlot();   // 仅管理员/系统管理员可删除地块
      plots.forEach(function (p) {
        var devs = devices.filter(function (d) { return d.plotId === p.id; });
        var online = devs.filter(function (d) { return d.online; }).length;
        var hasTemp = p.temp !== null && p.temp !== undefined;
        var hasHum = p.humidity !== null && p.humidity !== undefined;
        var tempHot = hasTemp && p.temp >= 35;
        var humDry = hasHum && p.humidity < 40;
        var tempText = hasTemp ? p.temp : '--';
        var humText = hasHum ? p.humidity : '--';

        var card = document.createElement('div');
        card.className = 'plot-card';
        card.innerHTML =
          '<div class="head">' +
            '<div>' +
              '<div class="name">' + p.name + '</div>' +
              '<div class="crop">' + p.crop + ' · ' + p.area + '</div>' +
            '</div>' +
            '<div class="flex gap-8">' +
              '<span class="badge badge-online"><span class="dot"></span>' + online + '/' + devs.length + ' 在线</span>' +
              (canManage ? '<button class="btn btn-danger btn-sm plot-del">删除</button>' : '') +
            '</div>' +
          '</div>' +
          '<div class="plot-metrics">' +
            '<div class="plot-metric"><div class="v' + (tempHot ? ' hot' : '') + '">' + tempText + '℃</div><div class="l">温度</div></div>' +
            '<div class="plot-metric">' +
              '<div class="hum-ring-wrap">' +
                '<div class="hum-ring-chart" data-hum="' + (hasHum ? p.humidity : 0) + '"></div>' +
                '<div class="hum-ring-center' + (humDry ? ' dry' : '') + '">' + humText + '%</div>' +
              '</div>' +
              '<div class="l">湿度</div>' +
            '</div>' +
            '<div class="plot-metric"><div class="v">' + devs.length + '</div><div class="l">设备</div></div>' +
          '</div>';
        grid.appendChild(card);
        if (canManage) {
          card.querySelector('.plot-del').addEventListener('click', function () {
            handleDeletePlot(p);
          });
        }
      });
      Animate.staggerIn(grid, { selector: '.plot-card' });
      renderHumRings(grid);
    }

    /* ---------- 填充趋势图地块下拉 ---------- */
    function fillPlotSelect() {
      var sel = document.getElementById('trendPlot');
      sel.innerHTML = '';
      plots.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name + '（' + p.crop + '）';
        sel.appendChild(opt);
      });
    }

    /* ---------- 加载趋势图 ---------- */
    function loadTrend(plotId) {
      API.getHistory(plotId, 7).then(function (res) {
        var d = res.data;
        renderChart('chartTemp', lineOption('温度（℃）', '℃', COLOR_TEMP, d.dates, d.temp));
        renderChart('chartHum', lineOption('土壤湿度（%）', '%', COLOR_HUM, d.dates, d.humidity));
        renderChart('chartLux', lineOption('亮度（lux）', ' lux', COLOR_LUX, d.dates, d.lux));
      });
    }

    /* ---------- 渲染天气预报（走后端 /api/weather，失败自动回退模拟数据） ---------- */
    function renderWeather() {
      API.getWeather().then(function (res) {
        var w = res.data;
        document.getElementById('weatherNow').innerHTML =
          '<div class="weather-now">' +
            '<span class="w-icon">' + w.now.icon + '</span>' +
            '<div class="w-now-info">' +
              '<div class="w-now-temp">' + w.now.temp +
                '<span class="w-now-text">' + w.now.text + '</span></div>' +
              '<div class="w-now-meta">湿度 ' + w.now.humidity + ' · ' + w.now.wind + '</div>' +
            '</div>' +
          '</div>';

        var fcHtml = '<div class="weather-forecast">';
        w.forecast.forEach(function (d) {
          fcHtml +=
            '<div class="weather-day">' +
              '<div class="wd-day">' + d.day + '</div>' +
              '<div class="wd-icon">' + d.icon + '</div>' +
              '<div class="wd-text">' + d.text + '</div>' +
              '<div class="wd-temp">' + d.low + '~' + d.high + '℃</div>' +
            '</div>';
        });
        fcHtml += '</div>';
        document.getElementById('weatherForecast').innerHTML = fcHtml;
      });
    }

    /* ---------- 渲染农事建议（根据数据库数据动态生成） ---------- */
    function renderAdvice() {
      API.getAdvice().then(function (res) {
        var advice = res.data || [];
        var html = '<div class="advice-list">';
        advice.forEach(function (a) {
          var actionHtml = a.href
            ? '<a class="ai-action" href="' + a.href + '">' + a.action + ' →</a>'
            : '';
          html +=
            '<div class="advice-item">' +
              '<span class="ai-icon">' + a.icon + '</span>' +
              '<div class="ai-body">' +
                '<div class="ai-top"><span class="ai-tag">' + a.tag + '</span>' + actionHtml + '</div>' +
                '<div class="ai-text">' + a.text + '</div>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
        document.getElementById('adviceList').innerHTML = html;
      });
    }

    /* ---------- 渲染设备状态环形图（模拟数据） ---------- */
    function renderDeviceStatus() {
      var dom = document.getElementById('deviceChart');
      if (!window.echarts || !dom) return;

      var total = MOCK.devices.length;
      var running = MOCK.devices.filter(function (d) { return d.running; }).length;
      var offline = MOCK.devices.filter(function (d) { return !d.online; }).length;
      var online = total - running - offline;

      var chart = echarts.init(dom);
      chart.setOption({
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(14, 23, 40, .96)',
          borderColor: 'rgba(52, 211, 153, .35)',
          borderWidth: 1,
          textStyle: { color: '#e7efff', fontSize: 12 },
          formatter: '{b}：{c} 台（{d}%）'
        },
        legend: {
          bottom: 0,
          itemWidth: 10,
          itemHeight: 10,
          itemGap: 16,
          textStyle: { color: '#9db1cc', fontSize: 12 }
        },
        title: {
          text: total + '',
          subtext: '设备总数',
          left: 'center',
          top: '30%',
          textStyle: { color: '#e7efff', fontSize: 24, fontWeight: 700 },
          subtextStyle: { color: '#64748b', fontSize: 11 }
        },
        series: [{
          type: 'pie',
          radius: ['55%', '75%'],
          center: ['50%', '42%'],
          avoidLabelOverlap: false,
          label: { show: false },
          emphasis: { scaleSize: 6 },
          data: [
            { value: online,  name: '在线',   itemStyle: { color: '#34d399' } },
            { value: running, name: '运行中', itemStyle: { color: '#22d3ee' } },
            { value: offline, name: '离线',   itemStyle: { color: '#64748b' } }
          ]
        }]
      });
    }

    /* ---------- 渲染实时告警面板（模拟数据） ---------- */
    function renderAlarmPanel() {
      var html = '<div class="alarm-list">';
      MOCK.alarms.slice(0, 5).forEach(function (a) {
        var severe = a.level === '严重';
        var pending = a.status === '未处理';
        html +=
          '<div class="alarm-item">' +
            '<span class="alarm-dot ' + (severe ? 'severe' : 'warn') + '"></span>' +
            '<div class="alarm-body">' +
              '<div class="alarm-title">' + a.type + ' · ' + a.plotName + '</div>' +
              '<div class="alarm-meta">' + a.time + '</div>' +
            '</div>' +
            '<span class="badge ' + (pending ? 'badge-alarm' : 'badge-normal') + '">' + a.status + '</span>' +
          '</div>';
      });
      html += '</div>';
      document.getElementById('alarmPanel').innerHTML = html;
    }

    /* ---------- 渲染最近操作日志（模拟数据） ---------- */
    function renderOperationLog() {
      var html = '<div class="log-list">';
      MOCK.controlLogs.slice(0, 5).forEach(function (l) {
        var success = l.result === '成功';
        html +=
          '<div class="log-item">' +
            '<span class="log-time">' + l.time.slice(11) + '</span>' +
            '<span class="log-desc">' + l.action + ' · ' + l.deviceName + '</span>' +
            '<span class="log-result ' + (success ? 'success' : 'fail') + '">' + l.result + '</span>' +
          '</div>';
      });
      html += '</div>';
      document.getElementById('operationLog').innerHTML = html;
    }

    document.getElementById('trendPlot').addEventListener('change', function () {
      loadTrend(this.value);
    });

    /* ---------- 删除地块 ---------- */
    function handleDeletePlot(plot) {
      var msg = '确定要删除地块「' + plot.name + '」吗？\n\n' +
                '删除后，该地块下的 ' + plot.deviceCount + ' 台设备及其监测数据、' +
                '控制日志、告警记录、阈值配置将一并删除，且不可恢复。';
      if (!confirm(msg)) return;

      API.deletePlot(plot.id).then(function () {
        plots = plots.filter(function (p) { return p.id !== plot.id; });
        devices = devices.filter(function (d) { return d.plotId !== plot.id; });
        renderKpi();
        renderPlotCards();
        fillPlotSelect();
        if (plots.length) loadTrend(plots[0].id);
        Toast.success('地块「' + plot.name + '」已删除');
      });
    }

    /* ---------- 添加地块：动态设备行 ---------- */
    function addDeviceRow(dev) {
      dev = dev || {};
      var row = document.createElement('div');
      row.className = 'flex gap-8 device-row';
      row.style.marginTop = '8px';
      row.innerHTML =
        '<input type="text" class="form-control dev-name" style="flex:2" placeholder="设备名称" value="' + (dev.name || '') + '">' +
        '<select class="form-control dev-type" style="flex:1.2">' +
          '<option>土壤湿度</option>' +
          '<option>温度</option>' +
          '<option>亮度</option>' +
          '<option>环境监测板</option>' +
          '<option>灌溉设备</option>' +
          '<option>摄像头</option>' +
        '</select>' +
        '<input type="text" class="form-control dev-ip" style="flex:2" placeholder="设备 IP" value="' + (dev.ip || '') + '">' +
        '<input type="number" class="form-control dev-port" style="flex:1" min="1" max="65535" placeholder="端口" value="' + (dev.port || '') + '">' +
        '<button class="btn btn-danger btn-sm dev-del" type="button">✕</button>';
      var cameraBox = document.createElement('div');
      cameraBox.className = 'camera-fields mt-8';
      cameraBox.innerHTML =
        '<div class="form-row">' +
          '<div class="form-group mb-0">' +
            '<label class="form-label">摄像头协议</label>' +
            '<select class="form-control dev-protocol">' +
              '<option value="mjpeg">MJPEG / HTTP</option>' +
              '<option value="rtsp">RTSP</option>' +
              '<option value="http">HTTP</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group mb-0">' +
            '<label class="form-label">用户名</label>' +
            '<input type="text" class="form-control dev-username" placeholder="如 admin" value="' + (dev.username || '') + '">' +
          '</div>' +
          '<div class="form-group mb-0">' +
            '<label class="form-label">密码</label>' +
            '<input type="password" class="form-control dev-password" placeholder="如 admin" value="' + (dev.password || '') + '">' +
          '</div>' +
        '</div>';
      row.appendChild(cameraBox);
      row.querySelector('.dev-protocol').value = dev.protocol || 'mjpeg';
      function syncCameraFields() {
        cameraBox.style.display = row.querySelector('.dev-type').value === '摄像头' ? 'block' : 'none';
      }
      row.querySelector('.dev-type').addEventListener('change', syncCameraFields);
      syncCameraFields();
      row.querySelector('.dev-del').addEventListener('click', function () { row.remove(); });
      document.getElementById('devRows').appendChild(row);
    }
    document.getElementById('addDevRow').addEventListener('click', function () { addDeviceRow(); });

    /* ---------- 添加地块弹窗控制 ---------- */
    var addPlotModal = document.getElementById('addPlotModal');
    document.getElementById('openAddPlot').addEventListener('click', function () {
      document.getElementById('plotName').value = '';
      document.getElementById('plotCrop').value = '';
      document.getElementById('plotArea').value = '';
      document.getElementById('devRows').innerHTML = '';
      addPlotModal.classList.add('show');
    });
    document.getElementById('cancelAddPlot').addEventListener('click', function () {
      addPlotModal.classList.remove('show');
    });
    // 点击遮罩空白处关闭
    addPlotModal.addEventListener('click', function (e) {
      if (e.target === addPlotModal) addPlotModal.classList.remove('show');
    });

    /* ---------- 确认添加地块 ---------- */
    document.getElementById('confirmAddPlot').addEventListener('click', function () {
      var name = document.getElementById('plotName').value.trim();
      var crop = document.getElementById('plotCrop').value.trim();
      var area = parseFloat(document.getElementById('plotArea').value.trim());
      if (!name) { Toast.error('请输入地块名称'); return; }
      if (!crop) { Toast.error('请输入种植作物'); return; }
      if (isNaN(area) || area <= 0) { Toast.error('请输入大于 0 的面积（亩）'); return; }

      // 收集并校验设备行（可为空，即不绑定设备）
      var newDevices = [];
      document.querySelectorAll('#devRows .device-row').forEach(function (row) {
        newDevices.push({
          name: row.querySelector('.dev-name').value.trim(),
          type: row.querySelector('.dev-type').value,
          ip: row.querySelector('.dev-ip').value.trim(),
          port: parseInt(row.querySelector('.dev-port').value.trim(), 10),
          protocol: row.querySelector('.dev-type').value === '摄像头' ? row.querySelector('.dev-protocol').value : null,
          username: row.querySelector('.dev-type').value === '摄像头' ? row.querySelector('.dev-username').value.trim() : null,
          password: row.querySelector('.dev-type').value === '摄像头' ? row.querySelector('.dev-password').value.trim() : null
        });
      });
      for (var i = 0; i < newDevices.length; i++) {
        var d = newDevices[i];
        if (!d.name) { Toast.error('请填写设备名称'); return; }
        if (!d.ip) { Toast.error('设备「' + d.name + '」需填写 IP'); return; }
        if (isNaN(d.port) || d.port < 1 || d.port > 65535) {
          Toast.error('设备「' + d.name + '」端口需在 1-65535 之间'); return;
        }
      }

      API.addPlot({ name: name, crop: crop, area: area, devices: newDevices }).then(function (res) {
        if (res.code !== 0) { Toast.error(res.msg || '添加失败'); return; }
        var np = res.data;
        plots.push(np);
        return API.getDevices().then(function (r2) {
          devices = r2.data;
          renderKpi();
          renderPlotCards();
          fillPlotSelect();
          document.getElementById('trendPlot').value = np.id;
          loadTrend(np.id);
          addPlotModal.classList.remove('show');
          document.getElementById('devRows').innerHTML = '';
          Toast.success('地块「' + np.name + '」添加成功');
        });
      });
    });

    /* ---------- 初始化 ---------- */
    API.getPlots().then(function (res) {
      plots = res.data;
      fillPlotSelect();
      return API.getDevices();
    }).then(function (res) {
      devices = res.data;
      return API.getAlarms();
    }).then(function (res) {
      alarms = res.data;
      renderKpi();
      renderPlotCards();
      if (plots.length) loadTrend(plots[0].id);
    });
  </script>
</body>
</html>
