<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 智慧农业平台</title>
  <script>
    // 提前应用主题，避免加载闪烁（FOUC）
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('agri_theme') || 'dark'); } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-fx" id="loginFx">
      <div class="login-grid"></div>
      <div class="login-scan"></div>
    </div>

    <!-- 主题切换（右上角浮动） -->
    <button class="theme-toggle" data-theme-toggle aria-label="切换主题">☀️</button>

    <div class="login-layout">
      <!-- 左侧：品牌 + 标语文字动画（常驻） -->
      <div class="login-left">
        <div class="login-brand">
          <div class="logo-big">🌾</div>
          <h1>智慧农业平台</h1>
          <p>物联网监测 · 设备控制 · 告警 · 智能问答</p>
        </div>
        <div class="login-slogan" id="loginSlogan">
          <div class="slogan-text" id="sloganText">让生长看得见</div>
        </div>
      </div>

      <!-- 右侧：登录面板（一直显示） -->
      <div class="login-panel">
        <div class="login-shimmer"></div>

        <!-- 登录视图 -->
        <div id="loginView">
          <!-- 账号密码 -->
          <div class="form-group">
            <label class="form-label">账号</label>
            <input type="text" class="form-control" id="username" placeholder="请输入账号">
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" id="password" placeholder="请输入密码">
          </div>

          <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>

          <div class="login-hint">演示账号：farmer01 / admin01 / sysadmin01 · 密码均为 123456（角色由账号决定）</div>
          <div class="login-switch">没有账号？<a id="toRegister">立即注册</a></div>
        </div>

        <!-- 注册视图（仅预留接口，后端接入后开放） -->
        <div id="registerView" style="display:none">
          <!-- 身份选择 -->
          <div class="login-role" id="regRoleTabs">
            <div class="role-tab active" data-role="farmer">农户</div>
            <div class="role-tab" data-role="admin">农场管理员</div>
            <div class="role-tab" data-role="sysadmin">系统管理员</div>
          </div>

          <div class="form-group">
            <label class="form-label">账号</label>
            <input type="text" class="form-control" id="regUsername" placeholder="请输入账号">
          </div>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" id="regPassword" placeholder="请输入密码">
          </div>
          <div class="form-group">
            <label class="form-label">确认密码</label>
            <input type="password" class="form-control" id="regConfirm" placeholder="请再次输入密码">
          </div>

          <button class="btn btn-primary btn-block" id="registerBtn">注 册</button>

          <div class="login-hint">注册功能仅预留接口，待后端接入后开放</div>
          <div class="login-switch">已有账号？<a id="toLogin">返回登录</a></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    var regRole = 'farmer';

    /* ===== 登录页动效初始化：背景粒子 + 左侧标语/品牌文字动画（常驻，面板不延迟登场） ===== */
    (function initLoginFx() {
      // 漂浮粒子（萤火，始终运行）
      var fx = document.getElementById('loginFx');
      if (fx) {
        var palette = ['52,211,153', '34,211,238'];
        var count = 28;
        for (var i = 0; i < count; i++) {
          var p = document.createElement('span');
          p.className = 'login-particle';
          var c = palette[i % palette.length];
          var size = 3 + Math.random() * 6;
          p.style.left = (Math.random() * 100).toFixed(2) + '%';
          p.style.width = size.toFixed(1) + 'px';
          p.style.height = size.toFixed(1) + 'px';
          p.style.background = 'radial-gradient(circle, rgba(' + c + ',.95), rgba(' + c + ',.3) 55%, transparent 75%)';
          p.style.animationDuration = (6 + Math.random() * 8).toFixed(2) + 's';
          p.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';
          p.style.opacity = 0;
          fx.appendChild(p);
        }
      }

      // 左侧标语：逐字浮现（常驻，不淡出）
      var sloganText = document.getElementById('sloganText');
      if (sloganText) {
        var s = sloganText.textContent;
        sloganText.textContent = '';
        for (var k = 0; k < s.length; k++) {
          var sc = document.createElement('span');
          sc.className = 'ch';
          sc.textContent = s[k];
          sc.style.animationDelay = (0.15 + k * 0.08).toFixed(2) + 's';
          sloganText.appendChild(sc);
        }
      }

      // 品牌标题「智慧农业平台」逐字浮现（页面加载即播放）
      var h1 = document.querySelector('.login-brand h1');
      if (h1) {
        var title = h1.textContent;
        h1.textContent = '';
        for (var j = 0; j < title.length; j++) {
          var ch = document.createElement('span');
          ch.className = 'ch';
          ch.textContent = title[j];
          ch.style.animationDelay = (0.25 + j * 0.09).toFixed(2) + 's';
          h1.appendChild(ch);
        }
      }

      // 副标题打字机（保留闪烁光标）
      var sub = document.querySelector('.login-brand p');
      if (sub) {
        var text = sub.textContent;
        sub.textContent = '';
        var node = document.createTextNode('');
        sub.appendChild(node);
        var idx = 0;
        var speed = 45;
        function typeSub() {
          if (idx < text.length) {
            node.textContent += text[idx++];
            setTimeout(typeSub, speed);
          }
        }
        setTimeout(typeSub, 600);
      }
    })();

    /* ---------- 登录 / 注册视图切换 ---------- */
    function showLogin() {
      document.getElementById('loginView').style.display = '';
      document.getElementById('registerView').style.display = 'none';
    }
    function showRegister() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('registerView').style.display = '';
    }
    document.getElementById('toRegister').addEventListener('click', showRegister);
    document.getElementById('toLogin').addEventListener('click', showLogin);

    /* ---------- 注册身份切换 ---------- */
    document.getElementById('regRoleTabs').querySelectorAll('.role-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.getElementById('regRoleTabs').querySelectorAll('.role-tab').forEach(function (t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');
        regRole = tab.getAttribute('data-role');
      });
    });

    /* ---------- 登录 ---------- */
    function doLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();
      if (!username || !password) {
        Toast.error('请输入账号和密码');
        return;
      }

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.classList.add('loading');

      API.login(username, password).then(function (res) {
        if (res.code === 0) {
          Layout.setUser({ name: res.data.name, roleName: res.data.roleName, role: res.data.role });
          Toast.success('欢迎，' + res.data.name);
          document.querySelector('.login-page').classList.add('success');
          setTimeout(function () { location.href = 'index.html'; }, 550);
        } else {
          Toast.error(res.msg || '登录失败');
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      });
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    /* ---------- 注册（仅预留接口） ---------- */
    function doRegister() {
      var username = document.getElementById('regUsername').value.trim();
      var password = document.getElementById('regPassword').value.trim();
      var confirm = document.getElementById('regConfirm').value.trim();
      if (!username || !password) {
        Toast.error('请输入账号和密码');
        return;
      }
      if (password !== confirm) {
        Toast.error('两次输入的密码不一致');
        return;
      }

      var btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.classList.add('loading');

      API.register({ username: username, password: password, role: regRole }).then(function (res) {
        btn.disabled = false;
        btn.classList.remove('loading');
        if (res.code === 0) {
          Toast.info(res.msg || '注册接口已预留，待后端接入');
          showLogin();
        } else {
          Toast.error(res.msg || '注册失败');
        }
      });
    }

    document.getElementById('registerBtn').addEventListener('click', doRegister);
    document.getElementById('regConfirm').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
