<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 智慧农业平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-panel">
      <div class="login-brand">
        <div class="logo-big">🌾</div>
        <h1>智慧农业平台</h1>
        <p>物联网监测 · 设备控制 · 告警 · 智能问答</p>
      </div>

      <!-- 登录视图 -->
      <div id="loginView">
        <!-- 账号密码 -->
        <div class="form-group">
          <label class="form-label">账号</label>
          <input type="text" class="form-control" id="username" placeholder="请输入账号">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" id="password" placeholder="请输入密码">
        </div>

        <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>

        <div class="login-hint">演示账号：farmer01 / admin01 / sysadmin01 · 密码均为 123456（角色由账号决定）</div>
        <div class="login-switch">没有账号？<a id="toRegister">立即注册</a></div>
      </div>

      <!-- 注册视图（仅预留接口，后端接入后开放） -->
      <div id="registerView" style="display:none">
        <!-- 身份选择 -->
        <div class="login-role" id="regRoleTabs">
          <div class="role-tab active" data-role="farmer">农户</div>
          <div class="role-tab" data-role="admin">农场管理员</div>
          <div class="role-tab" data-role="sysadmin">系统管理员</div>
        </div>

        <div class="form-group">
          <label class="form-label">账号</label>
          <input type="text" class="form-control" id="regUsername" placeholder="请输入账号">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" id="regPassword" placeholder="请输入密码">
        </div>
        <div class="form-group">
          <label class="form-label">确认密码</label>
          <input type="password" class="form-control" id="regConfirm" placeholder="请再次输入密码">
        </div>

        <button class="btn btn-primary btn-block" id="registerBtn">注 册</button>

        <div class="login-hint">注册功能仅预留接口，待后端接入后开放</div>
        <div class="login-switch">已有账号？<a id="toLogin">返回登录</a></div>
      </div>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    var regRole = 'farmer';

    /* ---------- 登录 / 注册视图切换 ---------- */
    function showLogin() {
      document.getElementById('loginView').style.display = '';
      document.getElementById('registerView').style.display = 'none';
    }
    function showRegister() {
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('registerView').style.display = '';
    }
    document.getElementById('toRegister').addEventListener('click', showRegister);
    document.getElementById('toLogin').addEventListener('click', showLogin);

    /* ---------- 注册身份切换 ---------- */
    document.getElementById('regRoleTabs').querySelectorAll('.role-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.getElementById('regRoleTabs').querySelectorAll('.role-tab').forEach(function (t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');
        regRole = tab.getAttribute('data-role');
      });
    });

    /* ---------- 登录 ---------- */
    function doLogin() {
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value.trim();
      if (!username || !password) {
        Toast.error('请输入账号和密码');
        return;
      }

      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = '登录中...';

      API.login(username, password).then(function (res) {
        if (res.code === 0) {
          Layout.setUser({ name: res.data.name, roleName: res.data.roleName, role: res.data.role });
          Toast.success('欢迎，' + res.data.name);
          setTimeout(function () { location.href = 'index.html'; }, 400);
        } else {
          Toast.error(res.msg || '登录失败');
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      });
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('username').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    /* ---------- 注册（仅预留接口） ---------- */
    function doRegister() {
      var username = document.getElementById('regUsername').value.trim();
      var password = document.getElementById('regPassword').value.trim();
      var confirm = document.getElementById('regConfirm').value.trim();
      if (!username || !password) {
        Toast.error('请输入账号和密码');
        return;
      }
      if (password !== confirm) {
        Toast.error('两次输入的密码不一致');
        return;
      }

      var btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = '注册中...';

      API.register({ username: username, password: password, role: regRole }).then(function (res) {
        btn.disabled = false;
        btn.textContent = '注 册';
        if (res.code === 0) {
          Toast.info(res.msg || '注册接口已预留，待后端接入');
          showLogin();
        } else {
          Toast.error(res.msg || '注册失败');
        }
      });
    }

    document.getElementById('registerBtn').addEventListener('click', doRegister);
    document.getElementById('regConfirm').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doRegister();
    });
  </script>
</body>
</html>
