<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据监测 - 智慧农业平台</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="monitoring">

  <div class="app">
    <!-- 侧边栏：由 layout.js 动态注入 -->
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main">
      <!-- 顶栏：由 layout.js 动态注入 -->
      <header class="topbar" id="topbar"></header>

      <main class="content">
        <!-- 地块选择工具条 -->
        <div class="card" style="padding:14px 20px;">
          <div class="flex-between items-center" style="flex-wrap:wrap;gap:12px;">
            <div class="flex items-center gap-8">
              <span class="text-secondary" style="font-weight:600">监测地块</span>
              <select class="form-control" id="plotSelect" style="width:220px"></select>
            </div>
            <div class="flex items-center gap-8">
              <span class="text-muted" id="updatedAt" style="font-size:12px">--</span>
              <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 手动刷新</button>
            </div>
          </div>
        </div>

        <!-- 实时数值（按地块内设备类型动态显示） -->
        <div class="grid metric-grid mt-16">
          <div class="metric-big" id="tempBox">
            <div class="value" id="metricTempBox"><span id="metricTemp">--</span><span class="unit">℃</span></div>
            <div class="label">🌡️ 实时温度</div>
          </div>
          <div class="metric-big" id="humBox">
            <div class="value" id="metricHumBox"><span id="metricHum">--</span><span class="unit">%</span></div>
            <div class="label">💧 土壤湿度</div>
          </div>
          <div class="metric-big" id="luxBox">
            <div class="value" id="metricLuxBox"><span id="metricLux">--</span><span class="unit">lx</span></div>
            <div class="label">💡 光照亮度</div>
          </div>
          <div class="empty" id="metricEmpty" style="display:none">该地块暂无数据监测设备</div>
        </div>

        <!-- 设备状态 -->
        <div class="card mt-20">
          <div class="card-header">
            <div>
              <div class="card-title">设备状态</div>
              <div class="card-sub">当前地块绑定的监测设备（数值按设备类型显示）</div>
            </div>
            <a class="btn btn-outline btn-sm" href="devices.html">🗂️ 设备管理</a>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>设备名称</th>
                  <th>类型</th>
                  <th>数值</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="deviceBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/mock.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/animate.js"></script>
  <script>
    Layout.init();

    var selectedPlotId = null;
    var devices = [];
    var thresholds = { humidityMin: 40, tempMax: 35 };

    /* 设备类型 → 该类型提供的监测指标（用于设备表格数值 + 状态总览显隐） */
    var TYPE_METRICS = {
      '温度':       ['temp'],
      '土壤湿度':   ['humidity'],
      '亮度':       ['lux'],
      '环境监测板': ['temp', 'humidity', 'lux'],
      '灌溉设备':   []
    };

    /* ---------- 类型徽章 ---------- */
    function typeBadge(type) {
      if (type === '灌溉设备')   return '<span class="badge badge-normal">灌溉设备</span>';
      if (type === '温度')       return '<span class="badge badge-warning">温度</span>';
      if (type === '亮度')       return '<span class="badge badge-info">亮度</span>';
      if (type === '环境监测板') return '<span class="badge badge-info">环境监测板</span>';
      return '<span class="badge badge-online">土壤湿度</span>';
    }

    /* ---------- 渲染当前地块设备状态 ---------- */
    function renderDeviceTable() {
      var body = document.getElementById('deviceBody');
      body.innerHTML = '';

      var list = devices.filter(function (d) { return d.plotId === selectedPlotId; });
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="5" class="empty">该地块暂无设备</td></tr>';
        return;
      }

      list.forEach(function (d) {
        var status = d.online
          ? '<span class="badge badge-online"><span class="dot"></span>在线</span>'
          : '<span class="badge badge-offline"><span class="dot"></span>离线</span>';
        var control = d.controllable
          ? '<a class="btn btn-sm btn-outline" href="control.html">🎛️ 去控制</a>'
          : '<span class="text-muted">—</span>';

        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + d.name + '</td>' +
          '<td>' + typeBadge(d.type) + '</td>' +
          '<td>' + deviceValueHtml(d) + '</td>' +
          '<td>' + status + '</td>' +
          '<td>' + control + '</td>';
        body.appendChild(tr);
      });
    }

    /* 按设备类型显示对应数值；离线设备不显示数据 */
    function deviceValueHtml(d) {
      var metrics = TYPE_METRICS[d.type] || [];
      if (!metrics.length) {
        if (d.controllable) return d.running ? '<span class="text-success">灌溉中</span>' : '<span class="text-muted">已停止</span>';
        return '<span class="text-muted">—</span>';
      }
      if (!d.online) return '<span class="text-muted">--</span>';
      var units = { temp: '℃', humidity: '%', lux: ' lx' };
      var htmls = [];
      metrics.forEach(function (m) {
        var v = d[m];
        htmls.push(v === null || v === undefined
          ? '<span class="text-muted">--</span>'
          : '<span class="text-secondary">' + Number(v).toFixed(1) + units[m] + '</span>');
      });
      return htmls.join(' ');
    }

    /* ---------- 根据地块内设备类型，决定状态总览显示哪些指标框 ---------- */
    function renderOverviewBoxes() {
      var plotDevices = devices.filter(function (d) { return d.plotId === selectedPlotId; });
      var has = { temp: false, humidity: false, lux: false };
      plotDevices.forEach(function (d) {
        (TYPE_METRICS[d.type] || []).forEach(function (m) { has[m] = true; });
      });
      document.getElementById('tempBox').style.display = has.temp ? '' : 'none';
      document.getElementById('humBox').style.display = has.humidity ? '' : 'none';
      document.getElementById('luxBox').style.display = has.lux ? '' : 'none';
      document.getElementById('metricEmpty').style.display =
        (has.temp || has.humidity || has.lux) ? 'none' : '';
    }

    /* ---------- 更新单个指标框：无数据→--，有数据→数值+阈值变色 ---------- */
    function setMetricBox(boxId, valueId, value, decimals, dangerWhen, warnWhen) {
      var box = document.getElementById(boxId);
      var el = document.getElementById(valueId);
      if (value === null || value === undefined) {
        el.textContent = '--';
        box.className = 'value';
        return;
      }
      var cls = '';
      if (dangerWhen !== null && dangerWhen !== undefined && value >= dangerWhen) cls = ' danger';
      else if (warnWhen !== null && warnWhen !== undefined && value < warnWhen) cls = ' warn';
      box.className = 'value' + cls;
      el.textContent = Number(value).toFixed(decimals);
    }

    /* ---------- 刷新实时数据（只更新可见的指标框） ---------- */
    function refreshRealtime() {
      if (!selectedPlotId) return;
      var plotId = selectedPlotId;
      API.getRealtime(plotId).then(function (res) {
        if (plotId !== selectedPlotId) return; // 响应过期（用户已切换地块），丢弃
        var d = res.data;
        if (document.getElementById('tempBox').style.display !== 'none') {
          setMetricBox('metricTempBox', 'metricTemp', d.temp, 1, thresholds.tempMax, null);
        }
        if (document.getElementById('humBox').style.display !== 'none') {
          setMetricBox('metricHumBox', 'metricHum', d.humidity, 1, null, thresholds.humidityMin);
        }
        if (document.getElementById('luxBox').style.display !== 'none') {
          setMetricBox('metricLuxBox', 'metricLux', d.lux, 0, null, null);
        }
        var anyData = (d.temp !== null && d.temp !== undefined) ||
                      (d.humidity !== null && d.humidity !== undefined) ||
                      (d.lux !== null && d.lux !== undefined);
        document.getElementById('updatedAt').textContent =
          anyData && d.updatedAt ? ('更新于 ' + d.updatedAt) : '暂无在线设备数据';
      });
    }

    /* ---------- 事件 ---------- */
    document.getElementById('plotSelect').addEventListener('change', function () {
      selectedPlotId = this.value;
      renderOverviewBoxes();
      refreshRealtime();
      renderDeviceTable();
    });
    document.getElementById('refreshBtn').addEventListener('click', refreshRealtime);

    /* ---------- 初始化 ---------- */
    API.getThresholds().then(function (res) { thresholds = res.data; });

    API.getPlots().then(function (res) {
      var sel = document.getElementById('plotSelect');
      res.data.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name + '（' + p.crop + '）';
        sel.appendChild(opt);
      });
      selectedPlotId = res.data[0].id;
      refreshRealtime();
    });

    API.getDevices().then(function (res) {
      devices = res.data;
      renderOverviewBoxes();
      renderDeviceTable();
    });

    // 每 5 秒自动刷新实时数据 + 设备数值（让状态栏与上方实时数据同步）
    function refreshDevices() {
      API.getDevices().then(function (res) {
        if (res.code === 0) {
          devices = res.data;
          renderOverviewBoxes();
          renderDeviceTable();
        }
      });
    }
    setInterval(function () {
      refreshRealtime();
      refreshDevices();
    }, 5000);
  </script>
</body>
</html>
